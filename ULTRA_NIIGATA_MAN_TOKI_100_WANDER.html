<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ULTRA NIIGATA MAN</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
  }
  body { touch-action: manipulation; }

  #app {
    position: relative;
    width: 100vw;
    height: 100dvh;
    background:
      radial-gradient(circle at 50% 18%, rgba(0,217,255,.16), transparent 34%),
      linear-gradient(180deg, #050505 0%, #111 100%);
    overflow: hidden;
  }

  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: block; }

  .center {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 120px;
    text-align: center;
  }

  h1 {
    font-size: clamp(48px, 7vw, 120px);
    margin: 0;
    letter-spacing: .08em;
    font-weight: 900;
    text-shadow: 0 0 28px rgba(0,217,255,.8);
  }

  h2 {
    font-size: clamp(34px, 4vw, 72px);
    margin: 12px 0;
    font-weight: 900;
  }

  p {
    font-size: clamp(20px, 2vw, 34px);
    margin: 10px 0;
    color: rgba(255,255,255,.82);
  }

  .startBtn, .restartBtn {
    margin-top: 34px;
    border: 3px solid #fff;
    background: #00d9ff;
    color: #000;
    font-size: clamp(26px, 3vw, 48px);
    font-weight: 900;
    border-radius: 999px;
    padding: 22px 70px;
    box-shadow: 0 0 32px rgba(0,217,255,.8);
  }

  #topPanel {
    position: absolute;
    top: env(safe-area-inset-top, 0);
    left: 0;
    right: 0;
    height: 165px;
    z-index: 30;
    padding: 18px 38px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.62));
    border-bottom: 2px solid rgba(255,255,255,.13);
  }

  #hud {
    height: 58px;
    display: grid;
    grid-template-columns: 1.4fr .8fr .8fr;
    align-items: center;
    font-weight: 900;
    letter-spacing: .05em;
  }

  #stageTitle { font-size: clamp(23px, 2.3vw, 42px); }
  #scoreBox, #timeBox { font-size: clamp(21px, 2vw, 38px); text-align: right; }

  #instruction {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(24px, 2.6vw, 48px);
    font-weight: 900;
    color: #00d9ff;
    text-shadow: 0 0 22px rgba(0,217,255,.8);
  }

  #arena {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(165px + env(safe-area-inset-top, 0px));
    bottom: 175px;
    overflow: hidden;
  }

  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    height: 150px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(22px, 4vw, 72px);
    z-index: 50;
  }

  .ctrl {
    width: clamp(150px, 17vw, 250px);
    height: clamp(96px, 11vw, 140px);
    border-radius: 30px;
    border: 4px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: clamp(42px, 6vw, 82px);
    font-weight: 900;
    box-shadow: 0 0 24px rgba(255,255,255,.16), inset 0 0 20px rgba(255,255,255,.08);
  }

  .ctrl:active, .ctrl.pressed {
    transform: scale(.95);
    background: #00d9ff;
    color: #000;
    box-shadow: 0 0 34px rgba(0,217,255,.95);
  }

  .laneLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255,255,255,.10);
  }

  .laneLabel {
    position: absolute;
    bottom: 8px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.22);
    font-size: 22px;
    font-weight: 900;
  }

  .flash {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    font-size: clamp(34px, 5vw, 90px);
    font-weight: 900;
    color: #00d9ff;
    text-shadow: 0 0 24px rgba(0,217,255,.9);
    pointer-events: none;
    animation: pop .65s ease forwards;
    z-index: 60;
    white-space: nowrap;
  }

  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    35% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }

  .bird {
    position: absolute;
    width: 56px;
    height: 44px;
    border-radius: 55% 55% 45% 45%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 16px rgba(255,255,255,.25);
  }
  .bird::before, .bird::after {
    content: "";
    position: absolute;
    top: 16px;
    width: 34px;
    height: 12px;
    border-radius: 50%;
    background: inherit;
  }
  .bird::before { left: -24px; transform: rotate(-24deg); }
  .bird::after { right: -24px; transform: rotate(24deg); }
  .tokiBird { background: #fff; border: 4px solid #ff7c7c; }
  .otherBird { background: #8b8b8b; border: 4px solid rgba(255,255,255,.6); }

  .numberPicker {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
  }
  .numChoice {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    border: 5px solid rgba(255,255,255,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 900;
    color: rgba(255,255,255,.75);
    background: rgba(255,255,255,.06);
  }
  .numChoice.selected {
    color: #000;
    background: #00d9ff;
    border-color: #fff;
    box-shadow: 0 0 38px rgba(0,217,255,.95);
    transform: scale(1.16);
  }

  .kobudai {
    position: absolute;
    left: 50%;
    top: 57%;
    transform: translate(-50%, -50%);
    width: 360px;
    height: 220px;
    border-radius: 55% 45% 50% 50%;
    background: #0b87ff;
    border: 6px solid #fff;
    box-shadow: 0 0 40px rgba(0,137,255,.7);
  }
  .kobudai::after {
    content: "";
    position: absolute;
    right: 52px;
    top: 62px;
    width: 34px;
    height: 34px;
    background: #fff;
    border-radius: 50%;
    box-shadow: inset 8px 0 0 #000;
  }
  .kobu {
    position: absolute;
    left: 66px;
    top: -50px;
    width: var(--kobu-size, 70px);
    height: var(--kobu-size, 70px);
    border-radius: 50%;
    background: #ff4d4d;
    border: 5px solid #fff;
    box-shadow: 0 0 26px rgba(255,77,77,.85);
    transition: .15s ease;
  }
  #kobuSignal {
    position: absolute;
    left: 50%;
    top: 22%;
    transform: translate(-50%, -50%);
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: 9px solid #fff;
    background: rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    font-weight: 900;
    color: rgba(255,255,255,.45);
  }
  #kobuSignal.on {
    background: #00d9ff;
    color: #000;
    box-shadow: 0 0 60px rgba(0,217,255,.95);
    animation: pulse .35s ease infinite alternate;
  }
  @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.08); } }

  .kobuLevel {
    position: absolute;
    right: 42px;
    bottom: 34px;
    font-size: clamp(26px, 3vw, 52px);
    font-weight: 900;
    color: #ff4d4d;
    text-shadow: 0 0 24px rgba(255,77,77,.8);
  }

  .cupWrap {
    position: absolute;
    left: 50%;
    top: 56%;
    transform: translate(-50%, -50%);
    width: min(1500px, 94vw);
    height: 360px;
  }
  .cup {
    position: absolute;
    width: 118px;
    height: 150px;
    border-radius: 18px 18px 48px 48px;
    background: linear-gradient(180deg, #8a5a2b 0%, #5b3518 100%);
    border: 6px solid #fff;
    box-shadow: 0 0 24px rgba(255,255,255,.2);
    transform: translate(-50%, -50%);
    transition: left .28s ease, top .28s ease, transform .18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 54px;
    font-weight: 900;
  }
  .cup.selected {
    transform: translate(-50%, -50%) scale(1.16);
    box-shadow: 0 0 46px rgba(0,217,255,.95);
    border-color: #00d9ff;
  }
  .cup.open { transform: translate(-50%, -72%) rotate(-8deg); }
  .cupTarget {
    background: linear-gradient(180deg, #ffd700 0%, #b88400 100%);
    color: #000;
    box-shadow: 0 0 58px rgba(255,215,0,.95);
  }
  .goldStick {
    position: absolute;
    width: 98px;
    height: 142px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #fff4a8 0%, #ffd700 34%, #b88400 100%);
    border: 6px solid #fff;
    box-shadow: 0 0 42px rgba(255,215,0,.95);
    transform: translate(-50%, -50%) rotate(13deg);
  }
  .goldStick::before {
    content: "小判";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 82px;
    border-radius: 50%;
    border: 4px solid rgba(0,0,0,.45);
    color: rgba(0,0,0,.72);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 900;
    writing-mode: vertical-rl;
    transform: translate(-50%, -50%);
  }
  .memoryPhase {
    position: absolute;
    left: 50%;
    top: 13%;
    transform: translateX(-50%);
    font-size: clamp(28px, 4vw, 72px);
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 26px rgba(255,215,0,.75);
    z-index: 20;
  }

  .boat {
    position: absolute;
    width: 128px;
    height: 86px;
    border-radius: 50%;
    background: #9b5b22;
    border: 6px solid #fff;
    bottom: 50px;
    transform: translateX(-50%);
    transition: left .12s ease;
    box-shadow: 0 0 24px rgba(255,255,255,.25);
  }
  .obstacle {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 24px;
    background: #888;
    border: 5px solid #fff;
    box-shadow: 0 0 20px rgba(255,255,255,.25);
    transform: translateX(-50%);
  }
  .wave { background: #00d9ff; border-radius: 50%; }
  .ika { background: #fff; border-radius: 50% 50% 38% 38%; }

  .rank {
    font-size: clamp(88px, 12vw, 190px);
    color: #00d9ff;
    font-weight: 900;
    text-shadow: 0 0 40px rgba(0,217,255,.9);
    line-height: 1;
  }

  .hero {
    margin: 20px auto;
    width: 150px;
    height: 215px;
    position: relative;
    filter: drop-shadow(0 0 30px rgba(0,217,255,.9));
  }
  .hero .head { position:absolute; left:49px; top:0; width:54px; height:54px; background:#fff; border-radius:50%; }
  .hero .body { position:absolute; left:30px; top:62px; width:90px; height:108px; background:#00d9ff; clip-path: polygon(50% 0, 100% 28%, 78% 100%, 22% 100%, 0 28%); }
  .hero .cape { position:absolute; left:8px; top:68px; width:136px; height:136px; background:#ff4d4d; clip-path: polygon(50% 0, 100% 100%, 0 100%); z-index:-1; opacity:.85; }



  .bird.wander {
    animation: none;
    transition: left .42s linear, top .42s linear, transform .42s linear;
  }

  .bird.moving {
    animation: birdFloat var(--dur, 2.2s) ease-in-out infinite alternate;
  }
  @keyframes birdFloat {
    0% { margin-left: -34px; margin-top: -20px; }
    100% { margin-left: 34px; margin-top: 20px; }
  }

  .endSplit {
    height: 100%;
    display: grid;
    grid-template-columns: 1.08fr .92fr;
    align-items: center;
    gap: 30px;
    padding: 52px 72px 178px;
  }
  .resultPanel {
    text-align: left;
    border: 3px solid rgba(255,255,255,.22);
    border-radius: 34px;
    padding: 36px 42px;
    background: rgba(255,255,255,.055);
    box-shadow: 0 0 34px rgba(0,217,255,.16);
  }
  .heroPanel {
    text-align: center;
    border: 3px solid rgba(0,217,255,.32);
    border-radius: 34px;
    padding: 36px 34px;
    background: radial-gradient(circle at 50% 35%, rgba(0,217,255,.24), rgba(255,255,255,.04) 55%, rgba(255,255,255,.02));
    box-shadow: 0 0 44px rgba(0,217,255,.24);
  }
  .heroPanel .hero {
    width: min(360px, 28vw);
    height: min(500px, 38vw);
    margin: 20px auto 28px;
    transform: scale(1.45);
  }
  .resultTitle {
    font-size: clamp(28px, 3.4vw, 62px);
    font-weight: 900;
    color: #00d9ff;
    text-shadow: 0 0 24px rgba(0,217,255,.75);
    margin-bottom: 14px;
  }
  .resultMessage {
    font-size: clamp(22px, 2.1vw, 38px);
    font-weight: 800;
    margin-bottom: 26px;
    color: rgba(255,255,255,.88);
  }
  .contribGrid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px 44px;
    font-size: clamp(20px, 2vw, 35px);
  }
  .contribGrid div:nth-child(even) {
    text-align: right;
    font-weight: 900;
  }
  .finalScoreSmall {
    margin-top: 26px;
    color: rgba(255,255,255,.62);
    font-size: clamp(16px, 1.4vw, 24px);
  }

  .note {
    position: absolute;
    left: 24px;
    bottom: 178px;
    color: rgba(255,255,255,.55);
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="app">
  <section id="titleScreen" class="screen active">
    <div class="center">
      <h1>ULTRA<br>NIIGATA MAN</h1>
      <p>新潟の力を集め、ヒーローを覚醒させろ。</p>
      <button class="startBtn" id="startBtn">START</button>
      <p style="font-size:20px;margin-top:24px;">画面下の ◀ ● ▶ でも操作できます</p>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div id="topPanel">
      <div id="hud">
        <div id="stageTitle">STAGE 1　トキを探せ</div>
        <div id="scoreBox">SCORE <span id="score">0</span></div>
        <div id="timeBox">TIME <span id="time">20</span></div>
      </div>
      <div id="instruction">トキを探せ！</div>
    </div>

    <div id="arena"></div>

    <div class="note">キーボード操作：← / Space / → でもテストできます</div>

    <div id="controls">
      <button class="ctrl" id="leftBtn">◀</button>
      <button class="ctrl" id="actionBtn">●</button>
      <button class="ctrl" id="rightBtn">▶</button>
    </div>
  </section>

  <section id="endScreen" class="screen">
    <div class="endSplit">
      <div class="resultPanel">
        <div class="resultTitle">UltraNiigataマン完成度</div>
        <div class="rank" id="rank">0%</div>
        <div class="resultMessage" id="resultMessage">NIIGATA IS ULTRA.</div>
        <div id="resultText"></div>
        <div class="finalScoreSmall">FINAL SCORE：<span id="finalScore">0</span></div>
        <button class="restartBtn" id="restartBtn">RESTART</button>
      </div>

      <div class="heroPanel">
        <h2>ULTRA NIIGATA MAN</h2>
        <div class="hero"><div class="cape"></div><div class="head"></div><div class="body"></div></div>
        <p>新潟の力、覚醒。</p>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const titleScreen = document.getElementById("titleScreen");
  const gameScreen = document.getElementById("gameScreen");
  const endScreen = document.getElementById("endScreen");
  const arena = document.getElementById("arena");
  const instructionEl = document.getElementById("instruction");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const stageTitleEl = document.getElementById("stageTitle");
  const finalScoreEl = document.getElementById("finalScore");
  const rankEl = document.getElementById("rank");
  const resultTextEl = document.getElementById("resultText");
  const resultMessageEl = document.getElementById("resultMessage");

  const lanes = [0.12, 0.31, 0.50, 0.69, 0.88];

  let stage = 0;
  let score = 0;
  let time = 20;
  let running = false;
  let timers = [];
  let rafs = [];
  let playerEl = null;
  let laneIndex = 2;

  let tokiScore = 0;
  let kobudaiScore = 0;
  let kobanCount = 0;
  let boatScore = 0;
  let boatElapsed = 0;

  let tokiRound = 0;
  let tokiCorrect = 0;
  let tokiAnswer = 3;
  let tokiOptions = [];
  let tokiOptionIndex = 0;
  let tokiCanAnswer = false;

  let kobuLevel = 1;
  let signalOn = false;
  let kobuSignalToken = 0;

  let memoryRound = 0;
  let cupCount = 3;
  let cupSelected = 0;
  let cupTarget = 0;
  let cupOrder = [];
  let cupCanChoose = false;

  const stageNames = [
    "STAGE 1　トキを探せ",
    "STAGE 2　こぶだいを育てろ",
    "STAGE 3　佐渡小判を追え",
    "STAGE 4　たらい舟"
  ];

  function show(screen) {
    [titleScreen, gameScreen, endScreen].forEach(s => s.classList.remove("active"));
    screen.classList.add("active");
  }

  function addTimer(id) { timers.push(id); return id; }
  function addRaf(id) { rafs.push(id); return id; }

  function clearAll() {
    timers.forEach(clearInterval);
    timers.forEach(clearTimeout);
    timers = [];
    rafs.forEach(cancelAnimationFrame);
    rafs = [];
    arena.innerHTML = "";
  }

  function updateHUD() {
    scoreEl.textContent = score;
    timeEl.textContent = time;
    stageTitleEl.textContent = stageNames[stage] || "CLEAR";
  }

  function setInstruction(text) {
    instructionEl.textContent = text || "";
  }

  function drawLanes() {
    for (let i = 0; i < lanes.length; i++) {
      const label = document.createElement("div");
      label.className = "laneLabel";
      label.textContent = i + 1;
      label.style.left = (lanes[i] * 100) + "%";
      arena.appendChild(label);
    }
    for (let i = 0; i < lanes.length - 1; i++) {
      const line = document.createElement("div");
      line.className = "laneLine";
      line.style.left = (((lanes[i] + lanes[i+1]) / 2) * 100) + "%";
      arena.appendChild(line);
    }
  }

  function flash(text, color) {
    const f = document.createElement("div");
    f.className = "flash";
    f.textContent = text;
    if (color) f.style.color = color;
    arena.appendChild(f);
    setTimeout(() => f.remove(), 700);
  }

  function countdown(seconds, done) {
    time = seconds;
    updateHUD();
    const id = setInterval(() => {
      time--;
      updateHUD();
      if (time <= 0) {
        clearInterval(id);
        clearAll();
        done();
      }
    }, 1000);
    addTimer(id);
  }

  function startGame() {
    score = 0;
    tokiScore = 0;
    kobudaiScore = 0;
    kobanCount = 0;
    boatScore = 0;
    stage = 0;
    show(gameScreen);
    startStage1();
  }

  function nextStage() {
    stage++;
    if (stage === 1) startStage2();
    else if (stage === 2) startStage3();
    else if (stage === 3) startStage4();
    else finishGame();
  }

  function finishGame() {
    clearAll();
    running = false;

    const maxScore = 15500;
    const completion = Math.min(100, Math.round((score / maxScore) * 100));

    finalScoreEl.textContent = score;
    rankEl.textContent = completion + "%";

    let text = "まだ眠っている…";
    if (completion >= 100) text = "境界を超えた。";
    else if (completion >= 81) text = "あと少しで完全覚醒。";
    else if (completion >= 61) text = "全身が見えてきた。";
    else if (completion >= 41) text = "上半身が完成。";
    else if (completion >= 21) text = "顔が現れた。";

    const tokiRate = Math.min(100, Math.round((tokiScore / 3600) * 100));
    const kobuRate = Math.min(100, Math.round((kobudaiScore / 3200) * 100));
    const boatRate = Math.min(100, Math.round((boatScore / 3900) * 100));

    resultMessageEl.textContent = text;
    resultTextEl.innerHTML = `
      <div class="contribGrid">
        <div>トキ発見率</div><div>${tokiRate}%</div>
        <div>こぶ成長率</div><div>${kobuRate}%</div>
        <div>小判発見数</div><div>${kobanCount}枚</div>
        <div>航海成功率</div><div>${boatRate}%</div>
      </div>
    `;

    show(endScreen);
  }

  function move(dir) {
    if (!running) return;
    if (stage === 0) moveTokiAnswer(dir);
    if (stage === 2) moveCupSelect(dir);
    if (stage === 3) setLane(laneIndex + dir);
  }

  function action() {
    if (!running) {
      if (titleScreen.classList.contains("active")) startGame();
      return;
    }
    if (stage === 0) chooseTokiAnswer();
    if (stage === 1) kobudaiHit();
    if (stage === 2) chooseCup();
  }

  function startStage1() {
    clearAll();
    running = true;
    tokiRound = 0;
    updateHUD();
    startTokiRound();
  }

  function startTokiRound() {
    clearAll();
    tokiRound++;
    tokiCanAnswer = false;

    const viewTime = tokiRound === 1 ? 5500 : tokiRound === 2 ? 5200 : 6200;
    if (tokiRound === 1) {
      tokiCorrect = 3 + Math.floor(Math.random() * 2);
    } else if (tokiRound === 2) {
      tokiCorrect = 14 + Math.floor(Math.random() * 3);
    } else {
      tokiCorrect = 8 + Math.floor(Math.random() * 3);
    }
    const totalBirds = tokiRound === 1 ? 12 : tokiRound === 2 ? 100 : 46;
    const otherCount = Math.max(0, totalBirds - tokiCorrect);
    const moving = tokiRound === 3;

    if (tokiRound === 1) {
      setInstruction("トキを探せ！5.5秒後に消えるよ");
    } else if (tokiRound === 2) {
      setInstruction("トキを探せ！100羽の中から15羽前後を見つけろ！");
    } else {
      setInstruction("ラスト！動き回る鳥の中からトキを覚えろ！");
    }

    updateHUD();
    renderBirds(tokiCorrect, otherCount, moving);

    addTimer(setTimeout(() => {
      arena.innerHTML = "";
      prepareTokiQuestion();
    }, viewTime));
  }

  function renderBirds(tokiCount, otherCount, moving) {
    const all = [];
    for (let i = 0; i < tokiCount; i++) all.push("toki");
    for (let i = 0; i < otherCount; i++) all.push("other");
    all.sort(() => Math.random() - 0.5);

    all.forEach((type, index) => {
      const b = document.createElement("div");
      b.className = "bird " + (type === "toki" ? "tokiBird" : "otherBird") + (moving ? " wander" : "");
      b.style.left = (6 + Math.random() * 88) + "%";
      b.style.top = (10 + Math.random() * 78) + "%";
      b.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 40 - 20}deg) scale(${0.72 + Math.random() * 0.38})`;
      arena.appendChild(b);
    });

    if (moving) startBirdWander();
  }

  function startBirdWander() {
    const birds = Array.from(document.querySelectorAll(".bird.wander"));
    const id = setInterval(() => {
      birds.forEach(b => {
        b.style.left = (6 + Math.random() * 88) + "%";
        b.style.top = (10 + Math.random() * 78) + "%";
        b.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 80 - 40}deg) scale(${0.72 + Math.random() * 0.38})`;
      });
    }, 430);
    addTimer(id);
  }

  function prepareTokiQuestion() {
    setInstruction("トキは何羽いた？ ◀ ▶で選んで ●で決定");
    tokiOptions = [];
    for (let n = tokiCorrect - 2; n <= tokiCorrect + 2; n++) {
      if (n > 0) tokiOptions.push(n);
    }
    while (tokiOptions.length < 5) tokiOptions.push(tokiOptions[tokiOptions.length - 1] + 1);
    tokiOptions = [...new Set(tokiOptions)].slice(0,5);
    tokiOptionIndex = Math.floor(Math.random() * tokiOptions.length);
    tokiCanAnswer = true;
    renderTokiChoices();
  }

  function renderTokiChoices() {
    arena.innerHTML = `<div class="numberPicker" id="numberPicker"></div>`;
    const picker = document.getElementById("numberPicker");
    tokiOptions.forEach((n, i) => {
      const c = document.createElement("div");
      c.className = "numChoice" + (i === tokiOptionIndex ? " selected" : "");
      c.textContent = n;
      picker.appendChild(c);
    });
  }

  function moveTokiAnswer(dir) {
    if (!tokiCanAnswer) return;
    tokiOptionIndex = Math.max(0, Math.min(tokiOptions.length - 1, tokiOptionIndex + dir));
    renderTokiChoices();
  }

  function chooseTokiAnswer() {
    if (!tokiCanAnswer) return;
    tokiCanAnswer = false;
    const answer = tokiOptions[tokiOptionIndex];
    if (answer === tokiCorrect) {
      score += 1200;
      tokiScore += 1200;
      flash("正解！ +1200", "#00d9ff");
    } else {
      score += 300;
      tokiScore += 300;
      flash("おしい！ 正解は" + tokiCorrect + "羽", "#ff4d4d");
    }
    updateHUD();

    addTimer(setTimeout(() => {
      if (tokiRound < 3) startTokiRound();
      else nextStage();
    }, 1500));
  }

  function startStage2() {
    clearAll();
    running = true;
    kobuLevel = 1;
    signalOn = false;
    kobuSignalToken++;
    setInstruction("青く光ったら ●！こぶが大きいほど速くなる");
    updateHUD();
    arena.innerHTML = `
      <div id="kobuSignal">●</div>
      <div class="kobudai"><div class="kobu" id="kobu"></div></div>
      <div class="kobuLevel" id="kobuLevelText">KOBU Lv.1</div>
    `;
    startKobuSignal();
    countdown(20, nextStage);
  }

  function startKobuSignal() {
    kobuSignalToken++;
    const token = kobuSignalToken;

    function getKobuDelay() {
      if (kobuLevel <= 2) return 2500 + Math.random() * 1000;
      if (kobuLevel <= 4) return 1800 + Math.random() * 1200;
      if (kobuLevel <= 6) return 1200 + Math.random() * 1000;
      if (kobuLevel <= 8) return 800 + Math.random() * 1000;
      return 400 + Math.random() * 800;
    }

    function schedule() {
      if (token !== kobuSignalToken || stage !== 1) return;
      const delay = getKobuDelay();
      const timeoutId = setTimeout(() => {
        if (token !== kobuSignalToken || stage !== 1) return;
        const signal = document.getElementById("kobuSignal");
        if (!signal) return;
        signalOn = true;
        signal.classList.add("on");
        signal.textContent = "押せ!";
        const onTime = kobuLevel >= 8 ? 480 : kobuLevel >= 5 ? 560 : 680;
        const offId = setTimeout(() => {
          if (token !== kobuSignalToken || stage !== 1) return;
          signalOn = false;
          signal.classList.remove("on");
          signal.textContent = "●";
          schedule();
        }, onTime);
        addTimer(offId);
      }, delay);
      addTimer(timeoutId);
    }
    schedule();
  }

  function kobudaiHit() {
    const kobu = document.getElementById("kobu");
    if (!kobu) return;
    if (signalOn) {
      score += 320;
      kobudaiScore += 320;
      const beforeLevel = kobuLevel;
      kobuLevel = Math.min(10, kobuLevel + 1);
      if (kobuLevel >= 10) flash("ULTRA KOBUDAI", "#ff4d4d");
      else if (kobuLevel >= 7 && beforeLevel < 7) flash("伝説級！", "#ff4d4d");
      else if (kobuLevel >= 5 && beforeLevel < 5) flash("巨大化！", "#ff4d4d");
      else flash("こぶ成長！", "#00d9ff");

      signalOn = false;
      const signal = document.getElementById("kobuSignal");
      if (signal) {
        signal.classList.remove("on");
        signal.textContent = "●";
      }
    } else {
      score = Math.max(0, score - 40);
      kobuLevel = Math.max(1, kobuLevel - 1);
      flash("早い！", "#ff4d4d");
    }
    kobu.style.setProperty("--kobu-size", (58 + kobuLevel * 24) + "px");
    const levelText = document.getElementById("kobuLevelText");
    if (levelText) levelText.textContent = "KOBU Lv." + kobuLevel;
    updateHUD();
  }

  function startStage3() {
    clearAll();
    running = true;
    memoryRound = 0;
    updateHUD();
    startMemoryRound();
  }

  function startMemoryRound() {
    clearAll();
    running = true;
    cupCanChoose = false;
    cupSelected = 0;
    memoryRound++;
    cupCount = memoryRound === 1 ? 3 : memoryRound === 2 ? 5 : 10;
    cupTarget = Math.floor(Math.random() * cupCount);
    cupOrder = Array.from({length: cupCount}, (_, i) => i);

    const roundName = memoryRound === 1 ? "3つのカップ" : memoryRound === 2 ? "5つのカップ" : "10個高速シャッフル";
    setInstruction(roundName + "：小判の場所を覚えろ！");
    arena.innerHTML = `<div class="cupWrap" id="cupWrap"></div>`;
    renderCups(true);

    addTimer(setTimeout(() => {
      setInstruction("シャッフル中！目で追え！");
      hideGoldStick();
      shuffleCups(memoryRound);
    }, memoryRound === 1 ? 2600 : 1500));
  }

  function cupPos(slot, count) {
    const wrap = document.getElementById("cupWrap");
    const w = wrap ? wrap.clientWidth : 1200;
    const h = wrap ? wrap.clientHeight : 360;
    const gap = w / (count + 1);
    return { x: gap * (slot + 1), y: h * 0.56 };
  }

  function renderCups(showGold) {
    const wrap = document.getElementById("cupWrap");
    if (!wrap) return;
    wrap.innerHTML = "";
    const count = cupOrder.length;
    for (let slot = 0; slot < count; slot++) {
      const cupId = cupOrder[slot];
      const pos = cupPos(slot, count);

      if (showGold && cupId === cupTarget) {
        const stick = document.createElement("div");
        stick.className = "goldStick";
        stick.style.left = pos.x + "px";
        stick.style.top = (pos.y - 68) + "px";
        wrap.appendChild(stick);
      }

      const cup = document.createElement("div");
      cup.className = "cup";
      cup.textContent = slot + 1;
      cup.dataset.cupId = cupId;
      cup.dataset.slot = slot;
      cup.style.left = pos.x + "px";
      cup.style.top = pos.y + "px";
      wrap.appendChild(cup);
    }
    updateCupSelection();
  }

  function hideGoldStick() {
    document.querySelectorAll(".goldStick").forEach(el => el.remove());
  }

  function shuffleCups(round) {
    const moves = round === 1 ? 3 : round === 2 ? 10 : 24;
    const speed = round === 1 ? 950 : round === 2 ? 380 : 155;
    let m = 0;

    const id = setInterval(() => {
      const a = Math.floor(Math.random() * cupCount);
      let b = Math.floor(Math.random() * cupCount);
      if (a === b) b = (b + 1) % cupCount;
      const tmp = cupOrder[a];
      cupOrder[a] = cupOrder[b];
      cupOrder[b] = tmp;
      animateCupPositions();
      m++;
      if (m >= moves) {
        clearInterval(id);
        cupCanChoose = true;
        setInstruction("どれに小判が入ってる？ ◀ ▶で選んで ●で決定");
        cupSelected = Math.floor(cupCount / 2);
        updateCupSelection();
      }
    }, speed);
    addTimer(id);
  }

  function animateCupPositions() {
    const count = cupOrder.length;
    document.querySelectorAll(".cup").forEach(cup => {
      const cupId = Number(cup.dataset.cupId);
      const slot = cupOrder.indexOf(cupId);
      const pos = cupPos(slot, count);
      cup.dataset.slot = slot;
      cup.style.left = pos.x + "px";
      cup.style.top = pos.y + "px";
      cup.textContent = slot + 1;
    });
  }

  function moveCupSelect(dir) {
    if (!cupCanChoose) return;
    cupSelected = Math.max(0, Math.min(cupCount - 1, cupSelected + dir));
    updateCupSelection();
  }

  function updateCupSelection() {
    document.querySelectorAll(".cup").forEach(cup => {
      cup.classList.toggle("selected", Number(cup.dataset.slot) === cupSelected);
    });
  }

  function chooseCup() {
    if (!cupCanChoose) return;
    cupCanChoose = false;
    const chosenCupId = cupOrder[cupSelected];
    const correctSlot = cupOrder.indexOf(cupTarget);
    const correct = chosenCupId === cupTarget;

    document.querySelectorAll(".cup").forEach(cup => {
      const cupId = Number(cup.dataset.cupId);
      if (cupId === cupTarget) {
        cup.classList.add("cupTarget");
        cup.classList.add("open");
        const wrap = document.getElementById("cupWrap");
        const slot = Number(cup.dataset.slot);
        const pos = cupPos(slot, cupCount);
        const stick = document.createElement("div");
        stick.className = "goldStick";
        stick.style.left = pos.x + "px";
        stick.style.top = (pos.y - 68) + "px";
        wrap.appendChild(stick);
      }
    });

    if (correct) {
      const bonus = memoryRound === 1 ? 900 : memoryRound === 2 ? 1500 : 2600;
      score += bonus;
      kobanCount++;
      flash("小判発見！ +" + bonus, "#ffd700");
    } else {
      score = Math.max(0, score - 300);
      flash("はずれ！ 正解は" + (correctSlot + 1), "#ff4d4d");
    }
    updateHUD();

    addTimer(setTimeout(() => {
      if (memoryRound < 3) startMemoryRound();
      else nextStage();
    }, 1600));
  }

  function startStage4() {
    clearAll();
    running = true;
    boatElapsed = 0;
    laneIndex = 2;
    drawLanes();
    createBoat();
    setInstruction("佐渡を目指せ！ 障害物をよけて！だんだん速くなる！");
    updateHUD();
    flash("たらい舟！");
    addTimer(setInterval(() => { boatElapsed += 1; }, 1000));
    addTimer(setInterval(spawnObstacle, 760));
    addTimer(setInterval(() => { score += 30; boatScore += 30; updateHUD(); }, 500));
    countdown(22, nextStage);
  }

  function createBoat() {
    playerEl = document.createElement("div");
    playerEl.className = "boat";
    arena.appendChild(playerEl);
    setLane(laneIndex);
  }

  function setLane(index) {
    laneIndex = Math.max(0, Math.min(4, index));
    if (playerEl) playerEl.style.left = (lanes[laneIndex] * 100) + "%";
  }

  function spawnObstacle() {
    const o = document.createElement("div");
    const types = ["obstacle", "obstacle wave", "obstacle ika"];
    o.className = types[Math.floor(Math.random() * types.length)];
    const targetLane = Math.floor(Math.random() * 5);
    let y = -90;
    o.style.left = (lanes[targetLane] * 100) + "%";
    o.style.top = y + "px";
    arena.appendChild(o);
    const speedBoost = Math.min(6.5, boatElapsed * 0.34);
    const speed = 3.5 + speedBoost + Math.random() * 2.1;

    function fall() {
      y += speed;
      o.style.top = y + "px";
      const hitLine = arena.clientHeight - 150;
      if (y > hitLine) {
        if (targetLane === laneIndex) {
          score = Math.max(0, score - 180);
          flash("HIT!", "#ff4d4d");
        } else {
          score += 120;
          boatScore += 120;
          flash("+120");
        }
        o.remove();
        updateHUD();
        return;
      }
      addRaf(requestAnimationFrame(fall));
    }
    fall();
  }

  function pressVisual(btn) {
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 120);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", () => location.reload());

  const leftBtn = document.getElementById("leftBtn");
  const actionBtn = document.getElementById("actionBtn");
  const rightBtn = document.getElementById("rightBtn");

  leftBtn.addEventListener("pointerdown", e => { e.preventDefault(); pressVisual(leftBtn); move(-1); });
  rightBtn.addEventListener("pointerdown", e => { e.preventDefault(); pressVisual(rightBtn); move(1); });
  actionBtn.addEventListener("pointerdown", e => { e.preventDefault(); pressVisual(actionBtn); action(); });

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { pressVisual(leftBtn); move(-1); }
    if (e.key === "ArrowRight") { pressVisual(rightBtn); move(1); }
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); pressVisual(actionBtn); action(); }
  });
})();
</script>
</body>
</html>
