<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ULTRA NIIGATA COUNT</title>
  <style>
    :root{
      --bg-top:#f7f4ed;
      --bg-bottom:#e8dfd1;
      --ink:#111111;
      --sub:#716c66;
      --red:#ff453a;
      --red-deep:#b91919;
      --red-soft:rgba(255,69,58,.18);
      --panel-top:#d9d1c3;
      --panel-side:#b9b0a1;
      --panel-front:#7e7365;
      --panel-front-2:#5f5549;
      --display-bg:#271312;
      --display-line:#ff5e54;
      --display-glow:rgba(255,94,84,.5);
      --digit-on:#ff5b51;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Arial", "Noto Sans JP", sans-serif;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      overscroll-behavior:none;
    }

    body{
      color:var(--ink);
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.62), transparent 28%),
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), transparent 34%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    .app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      isolation:isolate;
    }

    .ambient{
      position:absolute;
      inset:-8%;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 36%, rgba(255,255,255,.28), transparent 30%),
        radial-gradient(circle at 50% 70%, var(--red-soft), transparent 18%);
      filter:blur(36px);
      z-index:0;
    }

    .header{
      position:absolute;
      top:3.2vh;
      right:4vw;
      text-align:right;
      z-index:20;
      pointer-events:none;
    }

    .title{
      font-size:clamp(18px, 2.1vw, 34px);
      font-weight:900;
      letter-spacing:.18em;
      color:#151515;
      text-shadow:0 1px 0 rgba(255,255,255,.7);
    }

    .subtitle{
      margin-top:.25rem;
      font-size:clamp(10px, .95vw, 14px);
      letter-spacing:.28em;
      color:var(--sub);
    }

    .map-wrap{
      position:absolute;
      left:50%;
      top:34%;
      transform:translate(-50%, -50%);
      z-index:1;
      pointer-events:none;
    }

    .map-base,
    .map-glow{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .map-base{
      opacity:.72;
      mix-blend-mode:screen;
      filter:
        grayscale(1)
        brightness(1.38)
        contrast(1.02)
        drop-shadow(0 14px 36px rgba(0,0,0,.08));
    }

    .map-glow{
      opacity:0;
      mix-blend-mode:screen;
      filter:
        sepia(1)
        saturate(8)
        hue-rotate(-18deg)
        brightness(1.55)
        contrast(1.1)
        drop-shadow(0 0 12px rgba(255,106,92,.85))
        drop-shadow(0 0 32px rgba(255,106,92,.55));
    }

    .map-glow.active{
      animation:mapGlowPulse .9s ease-out;
    }

    @keyframes mapGlowPulse{
      0%   { opacity:0; transform:scale(1); }
      18%  { opacity:.9; }
      100% { opacity:0; transform:scale(1.02); }
    }

    .dot-layer{
      position:absolute;
      inset:0;
    }

    .dot{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      opacity:.18;
      transform:translate(-50%, -50%) scale(1);
      transition:
        opacity .18s ease,
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .dot.on{
      opacity:1;
      background:#fff4d7;
      box-shadow:
        0 0 8px rgba(255,244,215,.95),
        0 0 18px rgba(255,198,124,.75),
        0 0 34px rgba(255,106,92,.42);
    }

    .dot.pop{
      animation:dotPop .34s ease;
    }

    @keyframes dotPop{
      0%   { transform:translate(-50%, -50%) scale(.3); opacity:.25; }
      60%  { transform:translate(-50%, -50%) scale(1.8); opacity:1; }
      100% { transform:translate(-50%, -50%) scale(1); opacity:1; }
    }

    .hero-wrap{
      position:absolute;
      left:50%;
      bottom:24.5vh;
      transform:translateX(-50%);
      width:min(30vw, 420px);
      height:min(60vh, 760px);
      z-index:8;
      pointer-events:none;
    }

    .hero{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      filter:
        drop-shadow(0 28px 34px rgba(0,0,0,.20))
        drop-shadow(0 0 18px rgba(255,255,255,.12));
    }

    .hero-shine{
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      width:100%;
      height:100%;
      opacity:0;
      background:
        linear-gradient(110deg,
          transparent 0%,
          rgba(255,255,255,.03) 40%,
          rgba(255,255,255,.34) 50%,
          rgba(255,255,255,.05) 60%,
          transparent 100%);
      filter:blur(8px);
    }

    .hero-shine.active{
      animation:heroSweep .9s ease-out;
    }

    @keyframes heroSweep{
      0%   { opacity:0; transform:translateX(-76%); }
      24%  { opacity:.55; }
      100% { opacity:0; transform:translateX(-22%); }
    }

    .ultra-pop{
      position:absolute;
      left:50%;
      top:15vh;
      transform:translateX(-50%) scale(.78);
      z-index:30;
      font-size:clamp(38px, 5.2vw, 80px);
      font-weight:900;
      letter-spacing:.08em;
      color:#fff;
      text-shadow:
        0 0 10px rgba(255,69,58,.75),
        0 0 24px rgba(255,69,58,.45),
        0 10px 24px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
    }

    .ultra-pop.show{
      animation:ultraShow .55s ease;
    }

    @keyframes ultraShow{
      0%   { opacity:0; transform:translateX(-50%) scale(.72) translateY(10px); }
      20%  { opacity:1; }
      60%  { opacity:1; transform:translateX(-50%) scale(1.04) translateY(0); }
      100% { opacity:0; transform:translateX(-50%) scale(1) translateY(-10px); }
    }

    .flash{
      position:absolute;
      inset:0;
      z-index:22;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 58%, rgba(255,255,255,.95), rgba(255,255,255,.18) 24%, transparent 48%);
      opacity:0;
      mix-blend-mode:screen;
    }

    .flash.active{
      animation:flashPulse .28s ease-out;
    }

    @keyframes flashPulse{
      0%   { opacity:0; }
      35%  { opacity:1; }
      100% { opacity:0; }
    }

    .milestone-banner{
      position:absolute;
      top:12vh;
      left:4vw;
      z-index:28;
      min-width:12rem;
      padding:.85rem 1rem;
      border-radius:18px;
      text-align:center;
      background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.56));
      border:1px solid rgba(255,255,255,.65);
      box-shadow:0 14px 36px rgba(0,0,0,.10);
      opacity:0;
      transform:translateY(-10px) scale(.96);
      pointer-events:none;
    }

    .milestone-banner.show{
      animation:bannerIn 1.2s ease forwards;
    }

    .milestone-big{
      display:block;
      font-size:clamp(32px, 4vw, 56px);
      line-height:1;
      font-weight:900;
      letter-spacing:.04em;
      color:var(--red);
    }

    .milestone-small{
      display:block;
      margin-top:.2rem;
      font-size:clamp(10px, .95vw, 14px);
      letter-spacing:.18em;
      color:#7b756e;
    }

    @keyframes bannerIn{
      0%   { opacity:0; transform:translateY(-10px) scale(.96); }
      15%  { opacity:1; transform:translateY(0) scale(1); }
      80%  { opacity:1; transform:translateY(0) scale(1); }
      100% { opacity:0; transform:translateY(-6px) scale(.98); }
    }

    .pedestal-wrap{
      position:absolute;
      left:50%;
      bottom:3.8vh;
      transform:translateX(-50%);
      width:min(78vw, 980px);
      height:min(31vh, 280px);
      z-index:10;
    }

    .pedestal-top{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:36%;
      border-radius:10px 10px 0 0;
      background:
        linear-gradient(180deg, #e8e2d8, #cbc1b4 62%, #b8aea0);
      box-shadow:
        0 16px 36px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.55);
    }

    .pedestal-top::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 65%, rgba(255,255,255,.42), transparent 34%),
        linear-gradient(90deg, rgba(255,255,255,.14), transparent 15%, transparent 85%, rgba(0,0,0,.08));
      pointer-events:none;
    }

    .pedestal-front{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:68%;
      border-radius:0 0 10px 10px;
      background:
        linear-gradient(180deg, var(--panel-front) 0%, #6d6255 16%, var(--panel-front-2) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -20px 24px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .pedestal-front::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12), transparent 12%, transparent 88%, rgba(0,0,0,.24)),
        linear-gradient(180deg, transparent, rgba(0,0,0,.18));
      pointer-events:none;
    }

    .pedestal-shadow{
      position:absolute;
      left:7%;
      right:7%;
      bottom:-6%;
      height:12%;
      background:radial-gradient(ellipse at center, rgba(0,0,0,.18), transparent 70%);
      filter:blur(10px);
      pointer-events:none;
    }

    .push-button{
      position:absolute;
      left:50%;
      top:2%;
      transform:translateX(-50%);
      z-index:14;
      width:min(26vw, 300px);
      height:min(26vw, 300px);
      min-width:148px;
      min-height:148px;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:
        radial-gradient(circle at 50% 36%,
          rgba(255,255,255,.95) 0%,
          rgba(255,255,255,.48) 12%,
          rgba(255,98,88,.94) 28%,
          rgba(212,28,28,.98) 50%,
          rgba(122,10,10,.98) 72%,
          rgba(0,0,0,0) 73%);
      box-shadow:
        0 0 22px rgba(255,82,72,.35),
        0 0 56px rgba(255,82,72,.2),
        inset 0 10px 22px rgba(255,255,255,.18),
        inset 0 -20px 24px rgba(0,0,0,.22);
      color:#fff;
      font-size:clamp(22px, 2vw, 30px);
      font-weight:900;
      letter-spacing:.16em;
      text-shadow:
        0 0 8px rgba(255,255,255,.28),
        0 2px 10px rgba(0,0,0,.28);
      transition:transform .1s ease, filter .18s ease, box-shadow .18s ease;
      touch-action:manipulation;
    }

    .push-button::before{
      content:"";
      position:absolute;
      inset:10%;
      border-radius:999px;
      border:2px solid rgba(255,216,212,.28);
      box-shadow:
        0 0 16px rgba(255,123,112,.26),
        inset 0 0 16px rgba(255,255,255,.1);
    }

    .push-button::after{
      content:"";
      position:absolute;
      inset:-10%;
      border-radius:999px;
      border:2px solid rgba(255,94,84,.28);
      box-shadow:0 0 18px rgba(255,94,84,.18);
      pointer-events:none;
    }

    .push-button:hover{
      filter:brightness(1.03);
      box-shadow:
        0 0 24px rgba(255,82,72,.42),
        0 0 66px rgba(255,82,72,.24),
        inset 0 10px 22px rgba(255,255,255,.18),
        inset 0 -20px 24px rgba(0,0,0,.22);
    }

    .push-button:active{
      transform:translateX(-50%) scale(.97);
    }

    .ring-burst{
      position:absolute;
      left:50%;
      top:9%;
      transform:translateX(-50%);
      width:min(28vw, 320px);
      height:min(28vw, 320px);
      z-index:18;
      pointer-events:none;
    }

    .ring{
      position:absolute;
      inset:0;
      border-radius:999px;
      border:2px solid rgba(255,94,84,.48);
      box-shadow:0 0 24px rgba(255,94,84,.26);
      animation:ringExpand 1s ease-out forwards;
    }

    .ring.r2{ animation-delay:.12s; }
    .ring.r3{ animation-delay:.24s; }

    @keyframes ringExpand{
      from{ transform:scale(.6); opacity:.85; }
      to{ transform:scale(1.75); opacity:0; }
    }

    .counter-shell{
      position:absolute;
      left:50%;
      bottom:13%;
      transform:translateX(-50%);
      width:min(58vw, 720px);
      height:44%;
      z-index:16;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:1.4rem;
    }

    .counter-brace{
      width:44px;
      height:70%;
      position:relative;
      opacity:.92;
      filter:drop-shadow(0 0 10px rgba(255,94,84,.2));
      flex:0 0 auto;
    }

    .counter-brace.left::before,
    .counter-brace.left::after,
    .counter-brace.right::before,
    .counter-brace.right::after{
      content:"";
      position:absolute;
      border:2px solid var(--display-line);
      border-radius:6px;
      box-shadow:0 0 10px rgba(255,94,84,.2);
    }

    .counter-brace.left::before{
      left:8px;
      top:8%;
      width:14px;
      height:84%;
      border-right:none;
      transform:skewY(-18deg);
    }

    .counter-brace.left::after{
      left:24px;
      top:20%;
      width:8px;
      height:60%;
      border-right:none;
      transform:skewY(-18deg);
      opacity:.75;
    }

    .counter-brace.right::before{
      right:8px;
      top:8%;
      width:14px;
      height:84%;
      border-left:none;
      transform:skewY(18deg);
    }

    .counter-brace.right::after{
      right:24px;
      top:20%;
      width:8px;
      height:60%;
      border-left:none;
      transform:skewY(18deg);
      opacity:.75;
    }

    .counter-display{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:min(1vw, 12px);
      height:100%;
      padding:0 10px;
    }

    .digit-box{
      position:relative;
      flex:1 1 0;
      height:100%;
      max-width:150px;
      border-radius:16px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,.08)),
        var(--display-bg);
      box-shadow:
        inset 0 0 0 2px rgba(255,94,84,.6),
        inset 0 0 18px rgba(255,94,84,.18),
        0 0 18px rgba(255,94,84,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .digit-box::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%, rgba(0,0,0,.16)),
        radial-gradient(circle at 50% 16%, rgba(255,255,255,.1), transparent 42%);
      pointer-events:none;
    }

    .digit{
      position:relative;
      z-index:1;
      font-size:clamp(70px, 9vw, 138px);
      line-height:1;
      font-weight:900;
      color:var(--digit-on);
      text-shadow:
        0 0 10px var(--display-glow),
        0 0 26px rgba(255,94,84,.35);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing:-.06em;
      transform:translateY(.03em);
    }

    .counter-shell.bump{
      animation:counterBump .22s ease;
    }

    @keyframes counterBump{
      0%   { transform:translateX(-50%) scale(1); }
      50%  { transform:translateX(-50%) scale(1.05); }
      100% { transform:translateX(-50%) scale(1); }
    }

    .counter-shell.milestone .digit-box{
      box-shadow:
        inset 0 0 0 2px rgba(255,112,103,.82),
        inset 0 0 20px rgba(255,94,84,.28),
        0 0 26px rgba(255,94,84,.26);
    }

    .complete{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:40;
      background:radial-gradient(circle at center, rgba(255,255,255,.16), transparent 48%);
      opacity:0;
      pointer-events:none;
    }

    .complete.show{
      animation:completeFade 2s ease forwards;
    }

    .complete-text{
      padding:1rem 1.7rem;
      border-radius:22px;
      background:rgba(255,255,255,.64);
      backdrop-filter:blur(12px);
      font-size:clamp(30px, 4.6vw, 64px);
      font-weight:900;
      letter-spacing:.08em;
      color:#111;
      box-shadow:0 16px 50px rgba(0,0,0,.14);
    }

    @keyframes completeFade{
      0%   { opacity:0; }
      18%  { opacity:1; }
      100% { opacity:0; }
    }

    @media (max-width: 900px){
      .header{
        right:50%;
        transform:translateX(50%);
        text-align:center;
      }

      .milestone-banner{
        left:50%;
        transform:translateX(-50%);
        top:11vh;
      }

      .hero-wrap{
        width:min(42vw, 320px);
      }

      .pedestal-wrap{
        width:90vw;
      }

      .counter-shell{
        width:74vw;
        gap:.9rem;
      }

      .counter-brace{
        width:34px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="ambient"></div>
    <div class="flash" id="flash"></div>

    <div class="header">
      <div class="title">ULTRA NIIGATA COUNT</div>
      <div class="subtitle">PUSH TO LIGHT THE MAP</div>
    </div>

    <div class="map-wrap" id="mapWrap">
      <img src="./niigata.svg" alt="新潟県" class="map-base" id="mapBase">
      <img src="./niigata.svg" alt="" class="map-glow" id="mapGlow">
      <div class="dot-layer" id="dotLayer"></div>
    </div>

    <div class="hero-wrap">
      <div class="hero-shine" id="heroShine"></div>
      <img src="./ultraniigata.png" alt="UltraNiigataマン" class="hero" />
    </div>

    <div class="ultra-pop" id="ultraPop">Ultra!</div>

    <div class="milestone-banner" id="milestoneBanner">
      <span class="milestone-big" id="milestoneBig">0100</span>
      <span class="milestone-small">ULTRA MILESTONE</span>
    </div>

    <div class="pedestal-wrap">
      <div class="pedestal-top"></div>
      <div class="pedestal-front"></div>
      <div class="pedestal-shadow"></div>

      <button class="push-button" id="pushButton" aria-label="カウントアップ">PUSH</button>
      <div class="ring-burst" id="ringBurst"></div>

      <div class="counter-shell" id="counterShell">
        <div class="counter-brace left"></div>
        <div class="counter-display">
          <div class="digit-box"><span class="digit" data-digit>0</span></div>
          <div class="digit-box"><span class="digit" data-digit>0</span></div>
          <div class="digit-box"><span class="digit" data-digit>0</span></div>
          <div class="digit-box"><span class="digit" data-digit>0</span></div>
        </div>
        <div class="counter-brace right"></div>
      </div>
    </div>

    <div class="complete" id="complete">
      <div class="complete-text">NIIGATA FULL LIGHT</div>
    </div>

    <audio id="ultraSound" src="./ultra.mp3" preload="auto" playsinline></audio>
  </div>

  <script>
    const TOTAL = 1000;
    const BRIGHTNESS_THRESHOLD = 90;

    const mapWrap = document.getElementById("mapWrap");
    const dotLayer = document.getElementById("dotLayer");
    const mapGlow = document.getElementById("mapGlow");
    const heroShine = document.getElementById("heroShine");
    const ultraPop = document.getElementById("ultraPop");
    const ringBurst = document.getElementById("ringBurst");
    const pushButton = document.getElementById("pushButton");
    const flash = document.getElementById("flash");
    const milestoneBanner = document.getElementById("milestoneBanner");
    const milestoneBig = document.getElementById("milestoneBig");
    const counterShell = document.getElementById("counterShell");
    const digitEls = Array.from(document.querySelectorAll("[data-digit]"));
    const complete = document.getElementById("complete");
    const ultraSound = document.getElementById("ultraSound");

    const mapImage = new Image();
    mapImage.src = "./niigata.svg";

    let count = 0;
    let dots = [];
    let lastTrigger = 0;
    let audioUnlocked = false;
    let resizeTimer = null;

    function formatCount(num) {
      return String(num).padStart(4, "0");
    }

    function updateDigits() {
      const text = formatCount(count);
      digitEls.forEach((el, i) => {
        el.textContent = text[i];
      });
    }

    function halton(index, base) {
      let result = 0;
      let f = 1 / base;
      let i = index;
      while (i > 0) {
        result += f * (i % base);
        i = Math.floor(i / base);
        f /= base;
      }
      return result;
    }

    function brightnessAt(data, width, x, y) {
      const px = Math.max(0, Math.min(width - 1, Math.floor(x)));
      const py = Math.max(0, Math.min(Math.floor(y), (data.length / 4 / width) - 1));
      const index = (py * width + px) * 4;

      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];
      const a = data[index + 3];

      if (a < 10) return 0;

      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function setMapSize() {
      const aspect = (mapImage.naturalWidth && mapImage.naturalHeight)
        ? mapImage.naturalWidth / mapImage.naturalHeight
        : 1.6;

      const maxWidth = window.innerWidth * 0.96;
      const maxHeight = window.innerHeight * 0.72;

      let width = maxWidth;
      let height = width / aspect;

      if (height > maxHeight) {
        height = maxHeight;
        width = height * aspect;
      }

      mapWrap.style.width = `${width}px`;
      mapWrap.style.height = `${height}px`;
    }

    function clearDots() {
      dotLayer.innerHTML = "";
      dots = [];
    }

    function rebuildLitState() {
      dots.forEach((dot, index) => {
        dot.classList.toggle("on", index < count);
      });
    }

    function createDotElement(x, y) {
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;
      return dot;
    }

    function buildDots() {
      clearDots();

      const width = Math.round(mapWrap.clientWidth);
      const height = Math.round(mapWrap.clientHeight);
      if (!width || !height) return;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(mapImage, 0, 0, width, height);

      const data = ctx.getImageData(0, 0, width, height).data;
      const points = [];

      let i = 1;
      let guard = 0;

      while (points.length < TOTAL && guard < TOTAL * 120) {
        guard++;

        const x = width * halton(i, 2);
        const y = height * halton(i, 3);
        i++;

        if (brightnessAt(data, width, x, y) < BRIGHTNESS_THRESHOLD) continue;

        const jitterX = (halton(i + 17, 5) - 0.5) * 10;
        const jitterY = (halton(i + 31, 7) - 0.5) * 10;
        const px = x + jitterX;
        const py = y + jitterY;

        if (
          px < 0 || px > width ||
          py < 0 || py > height ||
          brightnessAt(data, width, px, py) < BRIGHTNESS_THRESHOLD
        ) continue;

        points.push({
          x: px,
          y: py,
          order: (px * 0.56 + py * 0.44) + ((halton(i + 13, 11) - 0.5) * 70)
        });
      }

      points.sort((a, b) => a.order - b.order);

      points.forEach((point) => {
        const dot = createDotElement(point.x, point.y);
        dotLayer.appendChild(dot);
        dots.push(dot);
      });

      rebuildLitState();
    }

    function showUltra() {
      ultraPop.classList.remove("show");
      void ultraPop.offsetWidth;
      ultraPop.classList.add("show");
    }

    function bumpCounter() {
      counterShell.classList.remove("bump");
      void counterShell.offsetWidth;
      counterShell.classList.add("bump");
    }

    function flashMap() {
      mapGlow.classList.remove("active");
      void mapGlow.offsetWidth;
      mapGlow.classList.add("active");
    }

    function shineHero() {
      heroShine.classList.remove("active");
      void heroShine.offsetWidth;
      heroShine.classList.add("active");
    }

    function screenFlash() {
      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");
    }

    function showRings() {
      ringBurst.innerHTML = `
        <div class="ring"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
      `;
      setTimeout(() => {
        ringBurst.innerHTML = "";
      }, 1200);
    }

    function showMilestone() {
      milestoneBig.textContent = formatCount(count);
      milestoneBanner.classList.remove("show");
      void milestoneBanner.offsetWidth;
      milestoneBanner.classList.add("show");
    }

    async function unlockAudio() {
      if (!ultraSound || audioUnlocked) return;
      try {
        ultraSound.volume = 1;
        ultraSound.currentTime = 0;
        await ultraSound.play();
        ultraSound.pause();
        ultraSound.currentTime = 0;
        audioUnlocked = true;
      } catch (e) {}
    }

    function playUltraSound() {
      if (!ultraSound) return;
      try {
        ultraSound.pause();
        ultraSound.currentTime = 0;
        ultraSound.play().catch(() => {});
      } catch (e) {}
    }

    function lightNextDot() {
      const dot = dots[count - 1];
      if (!dot) return;
      dot.classList.add("on", "pop");
      setTimeout(() => dot.classList.remove("pop"), 340);
    }

    function milestoneEffect() {
      flashMap();
      shineHero();
      screenFlash();
      showRings();
      showMilestone();

      counterShell.classList.add("milestone");
      setTimeout(() => counterShell.classList.remove("milestone"), 320);
    }

    function completeEffect() {
      flashMap();
      shineHero();
      screenFlash();
      showRings();

      complete.classList.add("show");
      setTimeout(() => complete.classList.remove("show"), 2000);
    }

    function increment() {
      if (count >= TOTAL) return;

      count += 1;
      updateDigits();
      lightNextDot();
      bumpCounter();
      showUltra();
      playUltraSound();

      if (count % 100 === 0) {
        milestoneEffect();
      }

      if (count === TOTAL) {
        completeEffect();
      }
    }

    function triggerCount() {
      const now = performance.now();
      if (now - lastTrigger < 90) return;
      lastTrigger = now;
      increment();
    }

    async function init() {
      try {
        if (mapImage.decode) {
          await mapImage.decode();
        } else {
          await new Promise((resolve, reject) => {
            mapImage.onload = resolve;
            mapImage.onerror = reject;
          });
        }
      } catch (e) {
        alert("niigata.svg が読み込めません。index.html と同じ場所に niigata.svg があるか確認してください。");
        return;
      }

      setMapSize();
      buildDots();
      updateDigits();
    }

    pushButton.addEventListener("pointerdown", unlockAudio);
    pushButton.addEventListener("click", triggerCount);

    window.addEventListener("keydown", async (e) => {
      if (e.repeat) return;
      if (e.code === "Space" || e.code === "Enter" || e.key === " ") {
        e.preventDefault();
        await unlockAudio();
        triggerCount();
      }
    });

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        setMapSize();
        buildDots();
      }, 120);
    });

    init();
  </script>
</body>
</html>
