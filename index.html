<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ULTRA NIIGATA CATCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#fff;touch-action:none;user-select:none}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background-image:url('BG3.png');background-size:contain; background-color:#000;background-position:center;background-repeat:no-repeat;transition:background-image .8s ease;}
#game::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:1;pointer-events:none}
#hud{position:absolute;inset:0;z-index:20;pointer-events:none}
#scorePanel,#timePanel{position:absolute;transform:translate(-50%,-50%);font-size:clamp(24px,4.2vw,46px);font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 3px 0 #000,0 0 12px #000;font-family:monospace;line-height:1}
#player{position:absolute;bottom:18px;width:140px;height:210px;background-image:url('ultraniigata-man.png');background-size:contain;background-repeat:no-repeat;background-position:center bottom;z-index:10;filter:drop-shadow(0 8px 18px rgba(0,0,0,.65))}
.item{position:absolute;width:72px;height:72px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;z-index:9;filter:drop-shadow(0 0 12px rgba(255,255,255,.75));background-size:contain;background-position:center;background-repeat:no-repeat}
.bomb{filter:drop-shadow(0 0 16px rgba(255,0,0,.9))}.player-hit{filter:brightness(3.4) grayscale(1) drop-shadow(0 0 22px #fff)!important}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(46px,11vw,110px);font-weight:900;color:#fff;text-shadow:0 0 24px #fff,0 5px 20px #000;pointer-events:none;z-index:30;opacity:0;transform:scale(.6)}
.show-message{animation:pop .75s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.45)}22%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:scale(1)}}
.shake{animation:shake .25s}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(10px,0)}50%{transform:translate(-10px,0)}75%{transform:translate(8px,0)}100%{transform:translate(0,0)}}
.flash::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55);z-index:25;pointer-events:none;animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#startScreen,#endScreen{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
#titleImage{width:100%;height:100%;object-fit:contain;display:block}
#endScreen{display:none;flex-direction:column;gap:24px;background:rgba(0,0,0,.86);padding:24px}
#endScreen h1{font-size:clamp(42px,10vw,96px);font-weight:900;letter-spacing:.08em;text-shadow:0 0 24px #fff}
#endScreen p{font-size:clamp(26px,6vw,52px);font-weight:900}
button{font-size:24px;font-weight:900;padding:16px 34px;border:3px solid #fff;background:#000;color:#fff;border-radius:999px;cursor:pointer}
#touchLeft,#touchRight{position:absolute;top:0;width:50%;height:100%;z-index:15;display:none}
#touchLeft{left:0}#touchRight{right:0}
@media (max-width:900px){#player{width:118px;height:178px}.item{width:60px;height:60px;font-size:38px}#touchLeft,#touchRight{display:block}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="scorePanel"><span id="score">0</span></div>
    <div id="timePanel"><span id="time">60</span></div>
  </div>

  <div id="player"></div>
  <div id="message"></div>
  <div id="touchLeft"></div>
  <div id="touchRight"></div>

  <div id="startScreen">
    <img src="title.png" id="titleImage" alt="NIIGATA QUEST" />
  </div>

  <div id="endScreen">
    <h1>FINISH!</h1>
    <p>SCORE <span id="finalScore">0</span></p>
    <button id="restartBtn">もう一度</button>
  </div>
</div>

<script>
const game = document.getElementById('game');
const player = document.getElementById('player');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const scorePanel = document.getElementById('scorePanel');
const timePanel = document.getElementById('timePanel');
const message = document.getElementById('message');
const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const touchLeft = document.getElementById('touchLeft');
const touchRight = document.getElementById('touchRight');

const titleBgm = new Audio('UltraNiigata_Man_Title_Theme_loop30.ogg');
const gameBgm = new Audio('UltraNiigata_Man_Gameplay_Theme_loop120.ogg');
const victoryFanfare = new Audio('UltraNiigata_Complete_Victory_Fanfare_5s.mp3');
titleBgm.loop = true;
gameBgm.loop = true;
titleBgm.volume = 0.85;
gameBgm.volume = 0.85;
victoryFanfare.volume = 1;

let score = 0;
let time = 60;
let playerX = window.innerWidth / 2;
let keys = {};
let items = [];
let gameRunning = false;
let spawnTimer = null;
let countdownTimer = null;
let animationId = null;
let victoryPlayed = false;
let bgStage = 1;
let touchDir = 0;

const itemTypes = [
  { name:'だんご', image:'item_1.png', point:10, weight:30 },
  { name:'おにぎり', image:'item_2.png', point:20, weight:25 },
  { name:'笹団子', image:'item_3.png', point:30, weight:18 },
  { name:'日本酒', image:'item_4.png', point:40, weight:12 },
  { name:'錦鯉', image:'item_6.png', point:50, weight:10 },
  { name:'スペシャル錦鯉', image:'item_5.png', point:100, weight:2, special:true },
  { name:'爆弾', emoji:'💣', point:-50, weight:3, bomb:true }
];

function safePlay(audio){
  audio.play().catch(()=>{});
}

function playTitleBgm(){
  if(!gameRunning){
    titleBgm.loop = true;
    safePlay(titleBgm);
  }
}

function startGame(){
  if(gameRunning) return;

  startScreen.style.display = 'none';
  endScreen.style.display = 'none';

  score = 0;
  time = 60;
  victoryPlayed = false;
  bgStage = 1;
  touchDir = 0;
  items.forEach(i => i.el.remove());
  items = [];

  scoreEl.textContent = score;
  timeEl.textContent = time;
  updateBackground(true);

  playerX = window.innerWidth / 2;
  updatePlayer();

  titleBgm.pause();
  titleBgm.currentTime = 0;
  gameBgm.currentTime = 0;
  gameBgm.volume = 0.85;
  safePlay(gameBgm);

  gameRunning = true;
  spawnTimer = setInterval(spawnItem, 600);
  countdownTimer = setInterval(() => {
    time--;
    timeEl.textContent = time;
    if(time <= 0) endGame();
  }, 1000);

  loop();
}

function endGame(){
  gameRunning = false;
  clearInterval(spawnTimer);
  clearInterval(countdownTimer);
  cancelAnimationFrame(animationId);
  touchDir = 0;

  gameBgm.pause();
  gameBgm.currentTime = 0;
  victoryFanfare.pause();
  victoryFanfare.currentTime = 0;

  finalScore.textContent = score;
  endScreen.style.display = 'flex';
}

function restartGame(){
  startGame();
}

function pickItemType(){
  const total = itemTypes.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * total;
  for(const item of itemTypes){
    r -= item.weight;
    if(r <= 0) return item;
  }
  return itemTypes[0];
}

function spawnItem(){
  if(!gameRunning) return;
  let type = pickItemType();

  const el = document.createElement('div');
  el.className = 'item';
  if(type.bomb){
    el.classList.add('bomb');
    el.textContent = type.emoji;
  }else{
    el.style.backgroundImage = "url('" + type.image + "')";
  }

  const size = window.innerWidth < 900 ? 60 : 72;
  const x = Math.random() * (window.innerWidth - size);
  el.style.left = x + 'px';
  el.style.top = '-80px';
  game.appendChild(el);

  items.push({el, x, y:-80, size, speed:3.5 + Math.random() * 3.2, type});
}

function loop(){
  if(!gameRunning) return;
  movePlayer();
  moveItems();
  animationId = requestAnimationFrame(loop);
}

function movePlayer(){
  if(keys.ArrowLeft || keys.a || keys.A) playerX -= 9;
  if(keys.ArrowRight || keys.d || keys.D) playerX += 9;
  if(touchDir !== 0) playerX += touchDir * 9;
  playerX = Math.max(54, Math.min(window.innerWidth - 54, playerX));
  updatePlayer();
}

function updatePlayer(){
  player.style.left = (playerX - player.offsetWidth / 2) + 'px';
}

function moveItems(){
  const playerRect = player.getBoundingClientRect();
  for(let i = items.length - 1; i >= 0; i--){
    const item = items[i];
    item.y += item.speed;
    item.el.style.top = item.y + 'px';
    const itemRect = item.el.getBoundingClientRect();

    const hit = itemRect.left < playerRect.right &&
                itemRect.right > playerRect.left &&
                itemRect.top < playerRect.bottom &&
                itemRect.bottom > playerRect.top;

    if(hit){
      catchItem(item);
      item.el.remove();
      items.splice(i,1);
      continue;
    }

    if(item.y > window.innerHeight + 100){
      item.el.remove();
      items.splice(i,1);
    }
  }
}

function catchItem(item){
  score += item.type.point;
  if(score < 0) score = 0;
  scoreEl.textContent = score;

  if(item.type.bomb){
    showMessage('-50');
    game.classList.add('shake');
    player.classList.add('player-hit');
    setTimeout(() => game.classList.remove('shake'), 260);
    setTimeout(() => player.classList.remove('player-hit'), 180);
  }else if(item.type.special){
    showMessage('BONUS +' + item.type.point);
  }else{
    showMessage('+' + item.type.point);
  }

  updateBackground(false);
  checkVictoryFanfare();
}


function positionHud(){
  // 背景画像は4:3でcontain表示。画像内のSCORE/TIME欄に数字を重ねる。
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const bgAspect = 4 / 3;

  let bgW, bgH, bgX, bgY;
  if(vw / vh > bgAspect){
    bgH = vh;
    bgW = vh * bgAspect;
    bgX = (vw - bgW) / 2;
    bgY = 0;
  }else{
    bgW = vw;
    bgH = vw / bgAspect;
    bgX = 0;
    bgY = (vh - bgH) / 2;
  }

  // 元画像 1536x1152 上の座標
  scorePanel.style.left = (bgX + bgW * (155 / 1536)) + 'px';
  scorePanel.style.top  = (bgY + bgH * (86 / 1152)) + 'px';

  timePanel.style.left = (bgX + bgW * (1378 / 1536)) + 'px';
  timePanel.style.top  = (bgY + bgH * (86 / 1152)) + 'px';
}

function updateBackground(initial){
  let nextStage = 1;
  let bg = 'BG3.png';

  if(score >= 2000){
    nextStage = 3;
    bg = 'BG1.png';
  }else if(score >= 501){
    nextStage = 2;
    bg = 'BG2.png';
  }

  if(initial || nextStage !== bgStage){
    game.style.backgroundImage = "url('" + bg + "')";
    if(!initial){
      game.classList.add('flash');
      setTimeout(() => game.classList.remove('flash'), 500);
    }
    bgStage = nextStage;
  }
}

function checkVictoryFanfare(){
  if(score >= 2000 && !victoryPlayed){
    victoryPlayed = true;
    gameBgm.volume = 0.28;
    victoryFanfare.currentTime = 0;
    safePlay(victoryFanfare);
    setTimeout(() => {
      if(gameRunning) gameBgm.volume = 0.85;
    }, 5000);
  }
}

function showMessage(text){
  message.textContent = text;
  message.classList.remove('show-message');
  void message.offsetWidth;
  message.classList.add('show-message');
}

startScreen.addEventListener('click', e => {
  const y = e.clientY;
  const h = window.innerHeight;
  // タイトル画像の下部「GAME START」周辺だけ反応
  if(y > h * 0.64 && y < h * 0.92){
    startGame();
  }else{
    playTitleBgm();
  }
});

startScreen.addEventListener('touchstart', e => {
  const y = e.touches[0].clientY;
  const h = window.innerHeight;
  if(y > h * 0.64 && y < h * 0.92){
    e.preventDefault();
    startGame();
  }else{
    playTitleBgm();
  }
},{passive:false});

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(!gameRunning && startScreen.style.display !== 'none' && e.code === 'Space'){
    e.preventDefault();
    startGame();
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

touchLeft.addEventListener('touchstart', e => { e.preventDefault(); touchDir = -1; }, {passive:false});
touchRight.addEventListener('touchstart', e => { e.preventDefault(); touchDir = 1; }, {passive:false});
touchLeft.addEventListener('touchend', () => { touchDir = 0; });
touchRight.addEventListener('touchend', () => { touchDir = 0; });
touchLeft.addEventListener('mousedown', () => { touchDir = -1; });
touchRight.addEventListener('mousedown', () => { touchDir = 1; });
window.addEventListener('mouseup', () => { touchDir = 0; });

restartBtn.addEventListener('click', restartGame);

window.addEventListener('resize', () => {
  playerX = Math.max(54, Math.min(window.innerWidth - 54, playerX));
  updatePlayer();
  positionHud();
});

positionHud();

// ブラウザの自動再生制限対策：最初の操作後にタイトルBGMを鳴らす
window.addEventListener('pointerdown', () => {
  if(!gameRunning && startScreen.style.display !== 'none') playTitleBgm();
},{once:true});
</script>
</body>
</html>
