<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ULTRA NIIGATA CATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
  touch-action:none;user-select:none;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
#game{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background-image:url('BG3.png');
  background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#000;
  transition:background-image .45s ease;
}
#game::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.08);z-index:1;pointer-events:none}
#playBar{
  position:absolute;left:0;top:0;width:100%;height:100%;
  z-index:18;pointer-events:none;
  background-image:url('play_bar(3).png');
  background-size:contain;background-position:center;background-repeat:no-repeat;
}
#hud{position:absolute;inset:0;z-index:22;pointer-events:none}
#scorePanel,#timePanel{
  position:absolute;transform:translate(-50%,-50%);
  font-family:'Press Start 2P',cursive;font-size:clamp(14px,2.3vw,28px);
  color:#fff;text-shadow:3px 3px 0 #000,0 0 8px #000;
  line-height:1;z-index:23;
}
#player{
  position:absolute;width:140px;height:210px;z-index:21;
  background-image:url('ultraniigata-man.png');
  background-size:contain;background-repeat:no-repeat;background-position:center bottom;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
  will-change:transform,filter;
}
.player-hit{filter:brightness(3.2) grayscale(1) drop-shadow(0 0 18px #fff)!important}
.item{
  position:absolute;width:68px;height:68px;z-index:17;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.6));
  will-change:transform;
}
.bomb{filter:drop-shadow(0 0 12px rgba(255,0,0,.9))}
#message{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Press Start 2P',cursive;font-size:clamp(28px,7vw,84px);
  color:#fff;text-shadow:5px 5px 0 #000,0 0 12px #000;
  pointer-events:none;z-index:30;opacity:0;transform:scale(.6);
}
.show-message{animation:pop .65s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.45)}25%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}
.shake{animation:shake .22s}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(8px,0)}50%{transform:translate(-8px,0)}75%{transform:translate(6px,0)}100%{transform:translate(0,0)}}
.flash::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.42);z-index:25;pointer-events:none;animation:flash .35s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

#startScreen{
  position:absolute;inset:0;z-index:60;background:#000;
  display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;
}
#titleImage{width:100%;height:100%;object-fit:contain;display:block}

#nameScreen{
  position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.78);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:24px;
}
#nameScreen h2,#nameDisplay,#romanPreview,#startNameBtn{
  font-family:'Press Start 2P',cursive;text-shadow:4px 4px 0 #000,0 0 10px #000;
}
#nameScreen h2{font-size:clamp(18px,4vw,38px);line-height:1.5}
#nameDisplay{
  width:min(520px,84vw);min-height:72px;padding:18px 20px;
  border:4px solid #fff;box-shadow:0 0 0 4px #000;background:#000;
  color:#fff;font-size:clamp(16px,3vw,28px);display:flex;align-items:center;justify-content:center;
}
#nameDisplay.empty::before{content:"NAME";color:rgba(255,255,255,.45)}
#romanPreview{font-size:clamp(12px,2.2vw,22px);color:#fff04a;min-height:1.7em}
#startNameBtn{
  border-radius:0;font-size:clamp(14px,2.6vw,24px);
  background:#000;color:#ff8ad8;border:4px solid #fff;box-shadow:0 0 0 4px #000;
  padding:16px 34px;cursor:pointer;
}

#finishOverlay{
  position:absolute;inset:0;z-index:75;display:none;align-items:center;justify-content:center;
  pointer-events:none;background:transparent;
}
#finishOverlay img{width:100%;height:100%;object-fit:contain;display:block}

#endScreen{
  position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:transparent;overflow:hidden;font-family:'Press Start 2P',cursive;
}
#resultImage{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#resultContent{
  position:absolute;z-index:82;color:#fff;text-shadow:4px 4px 0 #000,0 0 8px #000;
  text-align:center;line-height:1.35;font-family:'Press Start 2P',cursive;
}
#resultScore{font-size:clamp(8px,1.25vw,14px);margin-bottom:2.8em;white-space:nowrap}
#leaderboard{
  width:100%;overflow:hidden;font-size:clamp(6px,.92vw,11px);line-height:1.45;
  color:#fff;text-shadow:3px 3px 0 #000;
}
#leaderboardTitle{color:#fff04a;margin-bottom:4px;text-align:center}
.leaderRow{
  display:grid;grid-template-columns:50px 1fr 80px;width:60%;margin:0 auto;
  column-gap:16px;align-items:center;text-align:left;white-space:nowrap;
}
.leaderRow span:nth-child(1){text-align:left}
.leaderRow span:nth-child(2){text-align:left}
.leaderRow span:nth-child(3){text-align:right}

#touchLeft,#touchRight{position:absolute;top:0;width:50%;height:100%;z-index:15;display:none}
#touchLeft{left:0}#touchRight{right:0}
@media (max-width:900px){
  #player{width:118px;height:178px}
  .item{width:58px;height:58px;font-size:36px}
  #touchLeft,#touchRight{display:block}
}
</style>
</head>
<body>
<div id="game">
  <div id="playBar"></div>

  <div id="hud">
    <div id="scorePanel"><span id="score">0</span></div>
    <div id="timePanel"><span id="time">30</span></div>
  </div>

  <div id="player"></div>
  <div id="message"></div>
  <div id="touchLeft"></div>
  <div id="touchRight"></div>

  <div id="startScreen">
    <img src="title.png" id="titleImage" alt="NIIGATA QUEST" />
  </div>

  <div id="nameScreen">
    <h2>ENTER YOUR NAME</h2>
    <div id="nameDisplay" class="empty"></div>
    <div id="romanPreview">PLAYER</div>
    <button id="startNameBtn">START</button>
  </div>

  <div id="finishOverlay"><img src="finish.png" alt="FINISH" /></div>

  <div id="endScreen">
    <img src="result.png" id="resultImage" alt="RESULT" />
    <div id="resultContent">
      <div id="resultScore"><span id="resultName">PLAYER</span> SCORE <span id="finalScore">0</span></div>
      <div id="leaderboard"></div>
    </div>
  </div>
</div>

<script>
const game = document.getElementById('game');
const playBar = document.getElementById('playBar');
const player = document.getElementById('player');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const scorePanel = document.getElementById('scorePanel');
const timePanel = document.getElementById('timePanel');
const message = document.getElementById('message');
const startScreen = document.getElementById('startScreen');
const nameScreen = document.getElementById('nameScreen');
const nameDisplay = document.getElementById('nameDisplay');
const romanPreview = document.getElementById('romanPreview');
const startNameBtn = document.getElementById('startNameBtn');
const finishOverlay = document.getElementById('finishOverlay');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const resultName = document.getElementById('resultName');
const leaderboard = document.getElementById('leaderboard');
const resultContent = document.getElementById('resultContent');
const touchLeft = document.getElementById('touchLeft');
const touchRight = document.getElementById('touchRight');

function createSmartAudio(sources){
  const audio = new Audio();
  audio.preload = 'auto';
  audio.setAttribute('playsinline','');
  audio.setAttribute('webkit-playsinline','');
  const usable = sources.filter(s => !s.type || audio.canPlayType(s.type));
  audio.src = (usable[0] || sources[0]).src;
  audio.load();
  return audio;
}

const titleBgm = createSmartAudio([
  {src:'UltraNiigata_Man_Title_Theme_loop30(2).mp3', type:'audio/mpeg'},
  {src:'UltraNiigata_Man_Title_Theme_loop30(2).ogg', type:'audio/ogg'}
]);
const gameBgm = createSmartAudio([
  {src:'UltraNiigata_Man_Gameplay_Theme_loop120(1).mp3', type:'audio/mpeg'},
  {src:'UltraNiigata_Man_Gameplay_Theme_loop120(1).ogg', type:'audio/ogg'}
]);
const victoryFanfare = createSmartAudio([{src:'UltraNiigata_Complete_Victory_Fanfare_5s.mp3', type:'audio/mpeg'}]);
const resultBgm = createSmartAudio([{src:'UltraNiigata_Catch_Result_Screen_loop30.mp3', type:'audio/mpeg'}]);

titleBgm.loop = true;
gameBgm.loop = true;
resultBgm.loop = true;
titleBgm.volume = .85;
gameBgm.volume = .85;
victoryFanfare.volume = 1;
resultBgm.volume = .85;

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;

  [titleBgm, gameBgm, victoryFanfare, resultBgm].forEach(audio => {
    const oldVolume = audio.volume;
    audio.volume = 0;
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
      audio.volume = oldVolume;
    }).catch(() => {
      audio.volume = oldVolume;
    });
  });
}
function safePlay(audio){
  audio.play().catch(()=>{});
};

const nameDictionary = {
  '山本':'YAMAMOTO','美紅':'MIKU','みく':'MIKU','ミク':'MIKU','落合':'OCHIAI',
  '新潟':'NIIGATA','佐渡':'SADO','田中':'TANAKA','佐藤':'SATO','鈴木':'SUZUKI',
  '高橋':'TAKAHASHI','伊藤':'ITO','渡辺':'WATANABE'
};

function kanaCombo(two){
  const map = {
    'きゃ':'KYA','きゅ':'KYU','きょ':'KYO','しゃ':'SHA','しゅ':'SHU','しょ':'SHO','ちゃ':'CHA','ちゅ':'CHU','ちょ':'CHO',
    'にゃ':'NYA','にゅ':'NYU','にょ':'NYO','ひゃ':'HYA','ひゅ':'HYU','ひょ':'HYO','みゃ':'MYA','みゅ':'MYU','みょ':'MYO',
    'りゃ':'RYA','りゅ':'RYU','りょ':'RYO','ぎゃ':'GYA','ぎゅ':'GYU','ぎょ':'GYO','じゃ':'JA','じゅ':'JU','じょ':'JO',
    'びゃ':'BYA','びゅ':'BYU','びょ':'BYO','ぴゃ':'PYA','ぴゅ':'PYU','ぴょ':'PYO',
    'キャ':'KYA','キュ':'KYU','キョ':'KYO','シャ':'SHA','シュ':'SHU','ショ':'SHO','チャ':'CHA','チュ':'CHU','チョ':'CHO',
    'ニャ':'NYA','ニュ':'NYU','ニョ':'NYO','ヒャ':'HYA','ヒュ':'HYU','ヒョ':'HYO','ミャ':'MYA','ミュ':'MYU','ミョ':'MYO',
    'リャ':'RYA','リュ':'RYU','リョ':'RYO','ギャ':'GYA','ギュ':'GYU','ギョ':'GYO','ジャ':'JA','ジュ':'JU','ジョ':'JO',
    'ビャ':'BYA','ビュ':'BYU','ビョ':'BYO','ピャ':'PYA','ピュ':'PYU','ピョ':'PYO'
  };
  return map[two] || null;
}

function toRomaji(input){
  const raw = (input || '').trim();
  if(!raw) return 'PLAYER';
  if(nameDictionary[raw]) return nameDictionary[raw];

  let output = '';
  let smallTsu = false;
  for(let i=0;i<raw.length;i++){
    const ch = raw[i];
    if(ch === 'っ' || ch === 'ッ'){ smallTsu = true; continue; }
    if(ch === 'ー'){
      const last = output[output.length-1];
      if(/[AEIOU]/.test(last)) output += last;
      continue;
    }
    const combo = kanaCombo(raw.slice(i,i+2));
    let roma = combo || kanaMap[ch];
    if(combo) i++;
    if(!roma){
      if(/[a-zA-Z0-9]/.test(ch)) roma = ch.toUpperCase();
      else roma = '';
    }
    if(smallTsu && roma){ roma = roma[0] + roma; smallTsu = false; }
    output += roma;
  }
  output = output.replace(/[^A-Z0-9]/g,'').slice(0,10);
  return output || 'PLAYER';
}

function updateNameDisplay(){
  nameDisplay.textContent = nameRaw;
  nameDisplay.classList.toggle('empty', nameRaw.length === 0);
  romanPreview.textContent = toRomaji(nameRaw);
}

function openNameScreen(){
  unlockAudio();
  if(startScreen.style.display !== 'none'){ titleBgm.volume=.85; safePlay(titleBgm); }
  startScreen.style.display = 'none';
  nameScreen.style.display = 'flex';
  nameRaw = '';
  updateNameDisplay();
}

function confirmNameAndStart(){
  playerName = toRomaji(nameRaw);
  nameScreen.style.display = 'none';
  startGame();
}

function getLeaderboard(){
  try{return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');}
  catch(e){return [];}
}
function saveScore(){
  const list = getLeaderboard();
  list.push({name:playerName,score:score,date:new Date().toISOString()});
  list.sort((a,b)=>b.score-a.score);
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list.slice(0,10)));
}
function renderLeaderboard(){
  const list = getLeaderboard();
  let html = '<div id="leaderboardTitle">BEST 10</div>';
  if(list.length === 0){
    html += '<div class="leaderRow"><span>--</span><span>NO DATA</span><span>0</span></div>';
  }else{
    list.forEach((row,index)=>{
      const rank = String(index+1).padStart(2,'0');
      html += '<div class="leaderRow"><span>'+rank+'</span><span>'+row.name+'</span><span>'+row.score+'</span></div>';
    });
  }
  leaderboard.innerHTML = html;
}

function containRect(aspect){
  const vw=window.innerWidth, vh=window.innerHeight;
  let w,h,x,y;
  if(vw/vh > aspect){ h=vh; w=vh*aspect; x=(vw-w)/2; y=0; }
  else{ w=vw; h=vw/aspect; x=0; y=(vh-h)/2; }
  return {x,y,w,h};
}
function positionHud(){
  const r = containRect(4/3);
  scorePanel.style.left = (r.x + r.w*(66/640)) + 'px';
  scorePanel.style.top  = (r.y + r.h*(43/480)) + 'px';
  timePanel.style.left  = (r.x + r.w*(592/640)) + 'px';
  timePanel.style.top   = (r.y + r.h*(43/480)) + 'px';
}
function positionResultContent(){
  const r = containRect(4/3);
  resultContent.style.left = (r.x + r.w*(110/640)) + 'px';
  resultContent.style.top = (r.y + r.h*(155/480)) + 'px';
  resultContent.style.width = (r.w*(420/640)) + 'px';
  resultContent.style.height = (r.h*(245/480)) + 'px';
}
function updatePlayer(){
  const r = containRect(4/3);
  player.style.transform = 'translate3d(' + (playerX - player.offsetWidth/2) + 'px,' + (r.y + r.h*(421/480) - player.offsetHeight) + 'px,0)';
}

function startGame(){
  unlockAudio();
  if(gameRunning) return;
  startScreen.style.display='none';
  nameScreen.style.display='none';
  finishOverlay.style.display='none';
  endScreen.style.display='none';

  score=0; time=30; victoryPlayed=false; bgStage=1; touchDir=0;
  items.forEach(i=>i.el.remove()); items=[];
  scoreEl.textContent=score; timeEl.textContent=time;
  updateBackground(true);
  playerX=window.innerWidth/2;
  updatePlayer(); positionHud(); positionResultContent();

  stopAudio(titleBgm); stopAudio(resultBgm);
  gameBgm.currentTime=0; gameBgm.volume=.85; safePlay(gameBgm);

  gameRunning=true;
  spawnTimer=setInterval(spawnItem,520);
  countdownTimer=setInterval(()=>{
    time--; timeEl.textContent=time;
    if(time<=0) endGame();
  },1000);
  loop();
}

function endGame(){
  if(!gameRunning) return;
  gameRunning=false;
  clearInterval(spawnTimer); clearInterval(countdownTimer); cancelAnimationFrame(animationId);
  touchDir=0;
  stopAudio(gameBgm); stopAudio(victoryFanfare);
  finishOverlay.style.display='flex';
  setTimeout(()=>{
    finishOverlay.style.display='none';
    saveScore();
    finalScore.textContent=score;
    resultName.textContent=playerName;
    renderLeaderboard();
    endScreen.style.display='flex';
    positionResultContent();
    resultBgm.currentTime=0; safePlay(resultBgm);
  },1000);
}
function restartGame(){
  endScreen.style.display='none';
  finishOverlay.style.display='none';
  startScreen.style.display='flex';
  score=0; time=30;
  scoreEl.textContent=score; timeEl.textContent=time;
  updateBackground(true);
  stopAudio(resultBgm);
  safePlay(titleBgm);
}

function pickItemType(){
  const total = itemTypes.reduce((sum,item)=>sum+item.weight,0);
  let r = Math.random()*total;
  for(const item of itemTypes){ r -= item.weight; if(r <= 0) return item; }
  return itemTypes[0];
}
function spawnItem(){
  if(!gameRunning) return;
  if(items.length > 14) return;
  const type = pickItemType();
  const el = document.createElement('div');
  el.className='item';
  if(type.image) el.style.backgroundImage = "url('" + type.image + "')";
  if(type.bomb) el.classList.add('bomb');
  const size = window.innerWidth < 900 ? 58 : 68;
  const x = Math.random() * (window.innerWidth - size);
  game.appendChild(el);
  items.push({el,x,y:-80,speed:3.8+Math.random()*3.5,type});
  el.style.transform = 'translate3d(' + x + 'px,-80px,0)';
}
function loop(){
  if(!gameRunning) return;
  movePlayer();
  moveItems();
  animationId=requestAnimationFrame(loop);
}
function movePlayer(){
  if(keys.ArrowLeft || keys.a || keys.A) playerX -= 18;
  if(keys.ArrowRight || keys.d || keys.D) playerX += 18;
  if(touchDir !== 0) playerX += touchDir * 18;
  playerX = Math.max(54, Math.min(window.innerWidth-54, playerX));
  updatePlayer();
}
function moveItems(){
  const playerRect = player.getBoundingClientRect();
  for(let i=items.length-1;i>=0;i--){
    const item = items[i];
    item.y += item.speed;
    item.el.style.transform = 'translate3d(' + item.x + 'px,' + item.y + 'px,0)';
    const itemRect = item.el.getBoundingClientRect();
    const hit = itemRect.left < playerRect.right && itemRect.right > playerRect.left && itemRect.top < playerRect.bottom && itemRect.bottom > playerRect.top;
    if(hit){
      catchItem(item);
      item.el.remove(); items.splice(i,1);
      continue;
    }
    if(item.y > window.innerHeight + 100){
      item.el.remove(); items.splice(i,1);
    }
  }
}
function catchItem(item){
  score += item.type.point;
  if(score < 0) score = 0;
  scoreEl.textContent = score;
  if(item.type.bomb){
    showMessage('-50');
    game.classList.add('shake');
    player.classList.add('player-hit');
    setTimeout(()=>game.classList.remove('shake'),240);
    setTimeout(()=>player.classList.remove('player-hit'),160);
  }else{
    showMessage('+' + item.type.point);
  }
  updateBackground(false);
  checkVictoryFanfare();
}
function updateBackground(initial){
  let nextStage=1, bg='BG3.png';
  if(score>=1000){ nextStage=4; bg='BG1.png'; }
  else if(score>=601){ nextStage=3; bg='BG4.png'; }
  else if(score>=301){ nextStage=2; bg='BG2.png'; }
  if(initial || nextStage !== bgStage){
    game.style.backgroundImage = "url('" + bg + "')";
    if(!initial){ game.classList.add('flash'); setTimeout(()=>game.classList.remove('flash'),380); }
    bgStage = nextStage;
  }
}
function checkVictoryFanfare(){
  if(score>=1000 && !victoryPlayed){
    victoryPlayed=true;
    gameBgm.volume=.28;
    victoryFanfare.currentTime=0; safePlay(victoryFanfare);
    setTimeout(()=>{ if(gameRunning) gameBgm.volume=.85; },5000);
  }
}
function showMessage(text){
  message.textContent=text;
  message.classList.remove('show-message');
  void message.offsetWidth;
  message.classList.add('show-message');
}

startScreen.addEventListener('click', e=>{
  unlockAudio();
  const y=e.clientY,h=window.innerHeight;
  if(y > h*.64 && y < h*.92) openNameScreen();
  else { titleBgm.volume=.85; safePlay(titleBgm); }
});
startScreen.addEventListener('touchstart', e=>{
  unlockAudio();
  const y=e.touches[0].clientY,h=window.innerHeight;
  if(y > h*.64 && y < h*.92){ e.preventDefault(); openNameScreen(); }
  else { titleBgm.volume=.85; safePlay(titleBgm); }
},{passive:false});

startNameBtn.addEventListener('click', ()=>{ unlockAudio(); confirmNameAndStart(); });
endScreen.addEventListener('click', restartGame);

window.addEventListener('keydown', e=>{
  unlockAudio();

  if(!gameRunning && nameScreen.style.display !== 'none'){
    if(e.code === 'Enter'){ e.preventDefault(); confirmNameAndStart(); return; }
    if(e.code === 'Backspace'){ e.preventDefault(); nameRaw = nameRaw.slice(0,-1); updateNameDisplay(); return; }
    if(e.key && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey){
      e.preventDefault();
      if(nameRaw.length < 10){ nameRaw += e.key; updateNameDisplay(); }
      return;
    }
    return;
  }

  keys[e.key]=true;

  if(!gameRunning && endScreen.style.display !== 'none' && e.code === 'Space'){
    e.preventDefault(); restartGame();
  }else if(!gameRunning && startScreen.style.display !== 'none' && e.code === 'Space'){
    e.preventDefault(); openNameScreen();
  }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

touchLeft.addEventListener('touchstart', e=>{ e.preventDefault(); touchDir=-1; },{passive:false});
touchRight.addEventListener('touchstart', e=>{ e.preventDefault(); touchDir=1; },{passive:false});
touchLeft.addEventListener('touchend', ()=>{ touchDir=0; });
touchRight.addEventListener('touchend', ()=>{ touchDir=0; });
touchLeft.addEventListener('mousedown', ()=>{ touchDir=-1; });
touchRight.addEventListener('mousedown', ()=>{ touchDir=1; });
window.addEventListener('mouseup', ()=>{ touchDir=0; });

window.addEventListener('resize', ()=>{
  playerX=Math.max(54,Math.min(window.innerWidth-54,playerX));
  updatePlayer(); positionHud(); positionResultContent();
});

document.addEventListener('DOMContentLoaded', ()=>{
  positionHud(); positionResultContent(); updateNameDisplay();
});

window.addEventListener('pointerdown', ()=>{
  unlockAudio();
  if(!gameRunning && startScreen.style.display !== 'none'){ titleBgm.volume=.85; safePlay(titleBgm); }
});
</script>
</body>
</html>
