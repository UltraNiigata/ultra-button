<script>
  const TOTAL = 1000;

  const app = document.getElementById('app');
  const svg = document.getElementById('niigataSvg');
  const baseGroup = document.getElementById('niigataBaseGroup');
  const outlineGroup = document.getElementById('niigataOutlineGroup');
  const dotLayer = document.getElementById('dotLayer');
  const countText = document.getElementById('countText');
  const hitArea = document.getElementById('hitArea');
  const milestoneBadge = document.getElementById('milestoneBadge');
  const milestoneBig = document.getElementById('milestoneBig');
  const completeOverlay = document.getElementById('completeOverlay');
  const rings = document.getElementById('rings');

  let count = 0;
  let lastTrigger = 0;
  const dots = [];
  let hitShapes = [];

  function halton(index, base) {
    let result = 0;
    let f = 1 / base;
    let i = index;
    while (i > 0) {
      result += f * (i % base);
      i = Math.floor(i / base);
      f /= base;
    }
    return result;
  }

  function createSVGPoint(x, y) {
    const pt = svg.createSVGPoint();
    pt.x = x;
    pt.y = y;
    return pt;
  }

  function insideMap(x, y) {
    const pt = createSVGPoint(x, y);
    return hitShapes.some(shape => {
      try {
        return typeof shape.isPointInFill === 'function' && shape.isPointInFill(pt);
      } catch {
        return false;
      }
    });
  }

  async function loadNiigataSVG() {
    const res = await fetch('./niigata.svg');
    if (!res.ok) {
      throw new Error('niigata.svg の読み込みに失敗');
    }

    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const sourceSvg = doc.querySelector('svg');

    if (!sourceSvg) {
      throw new Error('niigata.svg 内に <svg> が見つからない');
    }

    const viewBox = sourceSvg.getAttribute('viewBox');
    if (viewBox) {
      svg.setAttribute('viewBox', viewBox);
    } else {
      const w = sourceSvg.getAttribute('width') || 1000;
      const h = sourceSvg.getAttribute('height') || 650;
      svg.setAttribute('viewBox', `0 0 ${parseFloat(w)} ${parseFloat(h)}`);
    }

    const geometryNodes = sourceSvg.querySelectorAll('path, polygon, rect, circle, ellipse');

    if (!geometryNodes.length) {
      throw new Error('地図形状が見つからない');
    }

    baseGroup.innerHTML = '';
    outlineGroup.innerHTML = '';
    hitShapes = [];

    geometryNodes.forEach((node) => {
      const baseClone = document.importNode(node, true);
      baseClone.removeAttribute('id');
      baseGroup.appendChild(baseClone);
      hitShapes.push(baseClone);

      const outlineClone = document.importNode(node, true);
      outlineClone.removeAttribute('id');
      outlineGroup.appendChild(outlineClone);
    });
  }

  function generateDots() {
    if (!hitShapes.length) {
      console.warn('地図形状がまだ読み込まれていません');
      return;
    }

    const bbox = baseGroup.getBBox();
    const points = [];
    let i = 1;
    let guard = 0;

    while (points.length < TOTAL && guard < TOTAL * 50) {
      guard++;

      const x = bbox.x + bbox.width * halton(i, 2);
      const y = bbox.y + bbox.height * halton(i, 3);
      i++;

      if (!insideMap(x, y)) continue;

      const jitterX = (halton(i + 17, 5) - 0.5) * 8;
      const jitterY = (halton(i + 31, 7) - 0.5) * 8;
      const px = x + jitterX;
      const py = y + jitterY;

      if (!insideMap(px, py)) continue;

      points.push({
        x: px,
        y: py,
        order: (px * 0.58 + py * 0.42) + ((halton(i + 13, 11) - 0.5) * 70)
      });
    }

    points.sort((a, b) => a.order - b.order);

    points.forEach((p, idx) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x);
      c.setAttribute('cy', p.y);
      c.setAttribute('r', 4.2);
      c.setAttribute('class', 'dot');
      c.style.transitionDelay = `${(idx % 12) * 0.004}s`;
      dotLayer.appendChild(c);
      dots.push(c);
    });

    console.log(`generated ${dots.length} dots`);
  }

  function formatCount(n) {
    return String(n).padStart(4, '0');
  }

  function bumpCount() {
    countText.classList.remove('bump');
    void countText.offsetWidth;
    countText.classList.add('bump');
  }

  function minorPulse() {
    app.style.setProperty('--count-scale', '1.045');
    setTimeout(() => app.style.setProperty('--count-scale', '1'), 130);
  }

  function showRings() {
    rings.innerHTML = `
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    `;
    app.style.setProperty('--ring-opacity', '1');
    setTimeout(() => {
      app.style.setProperty('--ring-opacity', '0');
      rings.innerHTML = '';
    }, 1200);
  }

  function milestoneEffect() {
    app.classList.add('ultra100', 'mapPulse', 'heroSweep');
    app.style.setProperty('--flash-opacity', '1');
    showRings();

    milestoneBig.textContent = formatCount(count);
    milestoneBadge.classList.remove('show');
    void milestoneBadge.offsetWidth;
    milestoneBadge.classList.add('show');

    setTimeout(() => app.style.setProperty('--flash-opacity', '0'), 180);
    setTimeout(() => app.classList.remove('ultra100', 'mapPulse', 'heroSweep'), 950);
  }

  function fullCompleteEffect() {
    app.classList.add('fullLit', 'mapPulse', 'heroSweep');
    app.style.setProperty('--flash-opacity', '1');
    showRings();
    setTimeout(() => app.style.setProperty('--flash-opacity', '0'), 260);

    completeOverlay.classList.add('show');
    setTimeout(() => completeOverlay.classList.remove('show'), 2200);
  }

  function lightNextDot() {
    const dot = dots[count - 1];
    if (!dot) return;
    dot.classList.add('on', 'justOn');
    setTimeout(() => dot.classList.remove('justOn'), 420);
  }

  function increment() {
    if (count >= TOTAL) return;

    count += 1;
    countText.textContent = formatCount(count);
    lightNextDot();
    bumpCount();
    minorPulse();

    if (count % 100 === 0) {
      milestoneEffect();
    }

    if (count === TOTAL) {
      fullCompleteEffect();
    }
  }

  function triggerCount() {
    const now = performance.now();
    if (now - lastTrigger < 90) return;
    lastTrigger = now;
    increment();
  }

  hitArea.addEventListener('click', triggerCount);
  hitArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    triggerCount();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
      e.preventDefault();
      triggerCount();
    }
  });

  async function init() {
    countText.textContent = formatCount(count);

    try {
      await loadNiigataSVG();
      generateDots();
      console.log('Niigata SVG loaded successfully');
    } catch (err) {
      console.error(err);
      alert('niigata.svg の読み込みに失敗しました。ファイル名と配置を確認してください。');
    }
  }

  init();
</script>
