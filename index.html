<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULTRA NIIGATA COUNT</title>
  <style>
    :root{
      --bg1:#f5f1ea;
      --bg2:#e6dfd3;
      --ink:#111111;
      --sub:#6e6a65;
      --red:#e3342f;
      --red-soft:rgba(227,52,47,.18);
      --gold:#ffd36a;
      --line:rgba(255,255,255,.34);
      --map-stroke:rgba(17,17,17,.2);
      --map-fill:rgba(255,255,255,.18);
      --dot-off:rgba(255,255,255,.08);
      --dot-on:#fff3d8;
      --dot-core:#ffffff;
      --ultra:#ff5a4f;
      --count-scale:1;
      --flash-opacity:0;
      --ring-opacity:0;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
      background:#000;
    }

    body{
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.55), transparent 34%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color:var(--ink);
    }

    .app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      isolation:isolate;
    }

    .grid{
      position:absolute;
      inset:0;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size:42px 42px;
      opacity:.18;
      mix-blend-mode:soft-light;
      pointer-events:none;
    }

    .ambient{
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.28), transparent 28%),
        radial-gradient(circle at 52% 58%, var(--red-soft), transparent 24%);
      filter:blur(24px);
      pointer-events:none;
    }

    .flash{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 56%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.2) 22%, transparent 46%);
      opacity:var(--flash-opacity);
      pointer-events:none;
      mix-blend-mode:screen;
    }

    .rings{
      position:absolute;
      left:50%;
      top:66%;
      width:12vmin;
      height:12vmin;
      transform:translate(-50%, -50%);
      pointer-events:none;
      opacity:var(--ring-opacity);
    }

    .ring{
      position:absolute;
      inset:0;
      border:2px solid rgba(227,52,47,.55);
      border-radius:999px;
      animation:ringExpand 1s ease-out forwards;
      box-shadow:0 0 24px rgba(227,52,47,.3);
    }

    .ring.r2{ animation-delay:.12s; }
    .ring.r3{ animation-delay:.24s; }

    @keyframes ringExpand{
      from{ transform:scale(.6); opacity:.8; }
      to{ transform:scale(5.4); opacity:0; }
    }

    .stage{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-rows: 12vh 1fr 20vh;
      z-index:2;
    }

    .titleWrap{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-top:3vh;
      flex-direction:column;
      gap:.4rem;
      text-align:right;
      padding-right:7vw;
    }

    .title{
      font-size:clamp(18px, 2.2vw, 34px);
      font-weight:800;
      letter-spacing:.18em;
      color:#171717;
      text-shadow:0 1px 0 rgba(255,255,255,.65);
    }

    .sub{
      font-size:clamp(10px, 1.1vw, 16px);
      letter-spacing:.2em;
      color:var(--sub);
    }

    .visualArea{
      position:relative;
      width:100%;
      height:100%;
    }

    .mapLayer{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      z-index:1;
    }

    #niigataSvg{
      width:min(88vw, 1200px);
      height:auto;
      opacity:.92;
      filter:drop-shadow(0 10px 36px rgba(0,0,0,.08));
    }

    #niigataBase{
      fill:var(--map-fill);
      stroke:var(--map-stroke);
      stroke-width:2.2;
    }

    #niigataOutline{
      fill:none;
      stroke:rgba(227,52,47,.34);
      stroke-width:3.2;
      opacity:.1;
      filter:url(#ultraGlow);
    }

    .mapPulse #niigataOutline{
      animation:outlinePulse .9s ease-out;
    }

    @keyframes outlinePulse{
      0%   { opacity:.1; stroke-width:3.2; }
      25%  { opacity:1;  stroke-width:8; }
      100% { opacity:.18; stroke-width:3.2; }
    }

    .hero{
      position:absolute;
      left:50%;
      bottom:17vh;
      transform:translateX(-50%);
      height:min(62vh, 760px);
      object-fit:contain;
      z-index:3;
      filter:
        drop-shadow(0 28px 40px rgba(0,0,0,.18))
        drop-shadow(0 0 14px rgba(255,255,255,.12));
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .heroShine{
      position:absolute;
      left:50%;
      bottom:21vh;
      width:min(34vw, 520px);
      height:min(56vh, 700px);
      transform:translateX(-50%);
      background:linear-gradient(110deg, transparent 0%, rgba(255,255,255,.08) 42%, rgba(255,255,255,.34) 50%, rgba(255,255,255,.06) 58%, transparent 100%);
      filter:blur(8px);
      opacity:0;
      z-index:4;
      pointer-events:none;
    }

    .heroSweep .heroShine{
      animation:heroSweep 1s ease-out;
    }

    @keyframes heroSweep{
      0%   { opacity:0; transform:translateX(-72%); }
      20%  { opacity:.45; }
      100% { opacity:0; transform:translateX(-26%); }
    }

    .counterPanel{
      position:absolute;
      left:50%;
      bottom:4.6vh;
      transform:translateX(-50%) scale(var(--count-scale));
      z-index:5;
      text-align:center;
      transition:transform .18s ease;
      padding:1.2rem 2.2rem;
      border-radius:28px;
      background:rgba(255,255,255,.42);
      backdrop-filter:blur(10px);
      box-shadow:
        0 12px 40px rgba(0,0,0,.1),
        inset 0 1px 0 rgba(255,255,255,.65);
      border:1px solid rgba(255,255,255,.5);
      min-width:min(56vw, 760px);
    }

    .counterLabel{
      font-size:clamp(11px, 1.15vw, 17px);
      letter-spacing:.28em;
      color:var(--sub);
      margin-bottom:.35rem;
    }

    .count{
      font-size:clamp(56px, 10vw, 132px);
      line-height:1;
      font-weight:900;
      letter-spacing:.06em;
      color:#111;
      text-shadow:
        0 0 0 rgba(0,0,0,0),
        0 0 18px rgba(255,255,255,.2);
      font-variant-numeric: tabular-nums;
    }

    .counterHint{
      margin-top:.35rem;
      font-size:clamp(11px, 1vw, 15px);
      color:#7a746d;
      letter-spacing:.16em;
    }

    .hitArea{
      position:absolute;
      left:50%;
      bottom:8.8vh;
      transform:translateX(-50%);
      width:min(24vw, 280px);
      height:min(24vw, 280px);
      border-radius:999px;
      border:none;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.55) 18%, rgba(227,52,47,.22) 34%, rgba(227,52,47,.08) 54%, transparent 70%);
      z-index:4;
      cursor:pointer;
      opacity:.95;
      box-shadow:
        0 0 50px rgba(227,52,47,.18),
        inset 0 0 0 1px rgba(255,255,255,.35);
      transition:transform .12s ease, opacity .2s ease;
    }

    .hitArea:active{
      transform:translateX(-50%) scale(.97);
    }

    .milestoneBadge{
      position:absolute;
      right:4vw;
      top:14vh;
      z-index:6;
      min-width:11rem;
      padding:.8rem 1rem;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
      border:1px solid rgba(255,255,255,.65);
      box-shadow:0 14px 36px rgba(0,0,0,.1);
      text-align:center;
      opacity:0;
      transform:translateY(-10px) scale(.96);
      pointer-events:none;
    }

    .milestoneBadge.show{
      animation:badgeIn 1.2s ease forwards;
    }

    @keyframes badgeIn{
      0%   { opacity:0; transform:translateY(-10px) scale(.96); }
      15%  { opacity:1; transform:translateY(0) scale(1); }
      80%  { opacity:1; transform:translateY(0) scale(1); }
      100% { opacity:0; transform:translateY(-6px) scale(.98); }
    }

    .milestoneBadge .big{
      display:block;
      font-size:clamp(34px, 4vw, 54px);
      font-weight:900;
      line-height:1;
      color:var(--red);
      letter-spacing:.03em;
    }

    .milestoneBadge .small{
      display:block;
      margin-top:.2rem;
      font-size:clamp(10px, .95vw, 14px);
      color:#7a746d;
      letter-spacing:.18em;
    }

    .completeOverlay{
      position:absolute;
      inset:0;
      z-index:7;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at center, rgba(255,255,255,.15), transparent 46%);
      opacity:0;
      pointer-events:none;
    }

    .completeOverlay.show{
      animation:completeFade 2s ease forwards;
    }

    @keyframes completeFade{
      0%   { opacity:0; }
      18%  { opacity:1; }
      100% { opacity:0; }
    }

    .completeText{
      padding:1rem 1.6rem;
      border-radius:22px;
      background:rgba(255,255,255,.6);
      backdrop-filter:blur(10px);
      font-size:clamp(32px, 5vw, 68px);
      font-weight:900;
      letter-spacing:.08em;
      color:#111;
      box-shadow:0 16px 50px rgba(0,0,0,.14);
    }

    .dot{
      fill:var(--dot-off);
      opacity:.18;
      transform-origin:center;
      transition:
        fill .22s ease,
        opacity .22s ease,
        transform .22s ease;
    }

    .dot.on{
      fill:var(--dot-on);
      opacity:1;
      filter:url(#dotGlow);
    }

    .dot.justOn{
      animation:dotPop .4s ease;
    }

    @keyframes dotPop{
      0%   { transform:scale(.3); opacity:.2; }
      55%  { transform:scale(1.75); opacity:1; }
      100% { transform:scale(1); opacity:1; }
    }

    .count.bump{
      animation:countBump .22s ease;
    }

    @keyframes countBump{
      0%   { transform:scale(1); }
      50%  { transform:scale(1.08); color:var(--red); }
      100% { transform:scale(1); }
    }

    .ultra100 .counterPanel{
      box-shadow:
        0 0 0 1px rgba(255,255,255,.6),
        0 0 34px rgba(227,52,47,.18),
        0 18px 50px rgba(0,0,0,.12);
    }

    .fullLit #niigataBase{
      fill:rgba(255,240,220,.34);
    }

    .fullLit #niigataOutline{
      opacity:.9;
      stroke:#ffb18f;
      stroke-width:7;
    }

    @media (max-width: 900px){
      .hero{ height:54vh; }
      .counterPanel{ min-width:78vw; }
      .titleWrap{ align-items:center; text-align:center; padding-right:0; }
      .milestoneBadge{ right:50%; transform:translateX(50%); top:12vh; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="grid"></div>
    <div class="ambient"></div>
    <div class="flash" id="flash"></div>

    <div class="rings" id="rings"></div>

    <div class="stage">
      <div class="titleWrap">
        <div class="title">ULTRA NIIGATA COUNT</div>
        <div class="sub">PUSH TO LIGHT THE MAP</div>
      </div>

      <div class="visualArea">
        <div class="mapLayer" id="mapLayer">
          <svg id="niigataSvg" viewBox="0 0 1000 650" aria-hidden="true">
            <defs>
              <filter id="dotGlow" x="-200%" y="-200%" width="400%" height="400%">
                <feGaussianBlur stdDeviation="3" result="blur1"/>
                <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur2"/>
                <feMerge>
                  <feMergeNode in="blur1"/>
                  <feMergeNode in="blur2"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="ultraGlow" x="-200%" y="-200%" width="400%" height="400%">
                <feGaussianBlur stdDeviation="6" result="glow"/>
                <feMerge>
                  <feMergeNode in="glow"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- ここに新潟県の path d を入れる -->
            <path
              id="niigataBase"
              d="REPLACE_WITH_NIIGATA_PATH">
            </path>

            <g id="dotLayer"></g>

            <path
              id="niigataOutline"
              d="REPLACE_WITH_NIIGATA_PATH">
            </path>
          </svg>
        </div>

        <!-- 画像はローカル配置推奨 -->
        <div class="heroShine"></div>
        <img src="assets/ultraniigata.png" alt="ultraniigataマン" class="hero" />
      </div>

      <div></div>
    </div>

    <button class="hitArea" id="hitArea" aria-label="count up"></button>

    <div class="counterPanel">
      <div class="counterLabel">CURRENT ULTRA LIGHT</div>
      <div class="count" id="countText">0000</div>
      <div class="counterHint">SPACE / ENTER / TAP</div>
    </div>

    <div class="milestoneBadge" id="milestoneBadge">
      <span class="big" id="milestoneBig">100</span>
      <span class="small">ULTRA MILESTONE</span>
    </div>

    <div class="completeOverlay" id="completeOverlay">
      <div class="completeText">NIIGATA FULL LIGHT</div>
    </div>
  </div>

  <script>
    const TOTAL = 1000;
    const app = document.getElementById('app');
    const svg = document.getElementById('niigataSvg');
    const basePath = document.getElementById('niigataBase');
    const dotLayer = document.getElementById('dotLayer');
    const countText = document.getElementById('countText');
    const hitArea = document.getElementById('hitArea');
    const mapLayer = document.getElementById('mapLayer');
    const milestoneBadge = document.getElementById('milestoneBadge');
    const milestoneBig = document.getElementById('milestoneBig');
    const completeOverlay = document.getElementById('completeOverlay');
    const rings = document.getElementById('rings');

    let count = 0;
    let lastTrigger = 0;
    const dots = [];

    // Halton sequenceで、ランダムすぎず均一に埋める
    function halton(index, base) {
      let result = 0;
      let f = 1 / base;
      let i = index;
      while (i > 0) {
        result += f * (i % base);
        i = Math.floor(i / base);
        f /= base;
      }
      return result;
    }

    function createSVGPoint(x, y) {
      const pt = svg.createSVGPoint();
      pt.x = x;
      pt.y = y;
      return pt;
    }

    function insidePath(x, y) {
      const pt = createSVGPoint(x, y);
      return basePath.isPointInFill(pt);
    }

    function generateDots() {
      const bbox = basePath.getBBox();
      const points = [];
      let i = 1;
      let guard = 0;

      while (points.length < TOTAL && guard < TOTAL * 30) {
        guard++;

        const x = bbox.x + bbox.width * halton(i, 2);
        const y = bbox.y + bbox.height * halton(i, 3);
        i++;

        if (!insidePath(x, y)) continue;

        // 少しだけ揺らして機械的すぎる並びを崩す
        const jitterX = (halton(i + 17, 5) - 0.5) * 8;
        const jitterY = (halton(i + 31, 7) - 0.5) * 8;
        const px = x + jitterX;
        const py = y + jitterY;

        if (!insidePath(px, py)) continue;

        points.push({
          x: px,
          y: py,
          order: (px * 0.58 + py * 0.42) + ((halton(i + 13, 11) - 0.5) * 70)
        });
      }

      // 左上→右下ベースで、面で広がる感じに
      points.sort((a, b) => a.order - b.order);

      points.forEach((p, idx) => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', p.x);
        c.setAttribute('cy', p.y);
        c.setAttribute('r', 4.2);
        c.setAttribute('class', 'dot');
        c.style.transitionDelay = `${(idx % 12) * 0.004}s`;
        dotLayer.appendChild(c);
        dots.push(c);
      });
    }

    function formatCount(n) {
      return String(n).padStart(4, '0');
    }

    function bumpCount() {
      countText.classList.remove('bump');
      void countText.offsetWidth;
      countText.classList.add('bump');
    }

    function minorPulse() {
      app.style.setProperty('--count-scale', '1.045');
      setTimeout(() => app.style.setProperty('--count-scale', '1'), 130);
    }

    function showRings() {
      rings.innerHTML = `
        <div class="ring"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
      `;
      app.style.setProperty('--ring-opacity', '1');
      setTimeout(() => {
        app.style.setProperty('--ring-opacity', '0');
        rings.innerHTML = '';
      }, 1200);
    }

    function milestoneEffect() {
      app.classList.add('ultra100', 'mapPulse', 'heroSweep');
      app.style.setProperty('--flash-opacity', '1');
      showRings();

      milestoneBig.textContent = formatCount(count);
      milestoneBadge.classList.remove('show');
      void milestoneBadge.offsetWidth;
      milestoneBadge.classList.add('show');

      setTimeout(() => app.style.setProperty('--flash-opacity', '0'), 180);
      setTimeout(() => app.classList.remove('ultra100', 'mapPulse', 'heroSweep'), 950);
    }

    function fullCompleteEffect() {
      app.classList.add('fullLit', 'mapPulse', 'heroSweep');
      app.style.setProperty('--flash-opacity', '1');
      showRings();
      setTimeout(() => app.style.setProperty('--flash-opacity', '0'), 260);

      completeOverlay.classList.add('show');
      setTimeout(() => completeOverlay.classList.remove('show'), 2200);
    }

    function lightNextDot() {
      const dot = dots[count - 1];
      if (!dot) return;
      dot.classList.add('on', 'justOn');
      setTimeout(() => dot.classList.remove('justOn'), 420);
    }

    function increment() {
      if (count >= TOTAL) return;

      count += 1;
      countText.textContent = formatCount(count);
      lightNextDot();
      bumpCount();
      minorPulse();

      if (count % 100 === 0) {
        milestoneEffect();
      }

      if (count === TOTAL) {
        fullCompleteEffect();
      }
    }

    function triggerCount() {
      const now = performance.now();
      if (now - lastTrigger < 90) return; // 誤爆防止
      lastTrigger = now;
      increment();
    }

    hitArea.addEventListener('click', triggerCount);
    hitArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerCount();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerCount();
      }
    });

    generateDots();
    countText.textContent = formatCount(count);
  </script>
</body>
</html>
