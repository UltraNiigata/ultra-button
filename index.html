<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8" />

  <title>ULTRA BUTTON</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>

    body {
      margin: 0;
      background: black;
      color: red;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      font-family: sans-serif;
      transition: background 0.1s;
      overflow: hidden;
    }

    h1 {
      font-size: 80px;
      margin: 0;
      letter-spacing: 10px;
      text-align: center;
    }

    #count {
      font-size: 120px;
      margin-top: 20px;
    }

    button {
      margin-top: 40px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: none;
      background: red;
      color: white;
      font-size: 40px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.95);
    }

    .flash {
      background: #330000;
    }

  </style>

</head>

<body>

  <h1>ULTRA COUNT</h1>

  <div id="count">0</div>

  <button id="ultraButton">
    PUSH
  </button>

  <script>

    const button = document.getElementById("ultraButton");
    const countDisplay = document.getElementById("count");

    let count = localStorage.getItem("ultraCount") || 0;

    countDisplay.textContent = count;

    button.addEventListener("click", () => {

      count++;

      countDisplay.textContent = count;

      localStorage.setItem("ultraCount", count);

      const s = new Audio("ultra.mp3");

      s.play().catch((error) => {
        console.log(error);
      });

      document.body.classList.add("flash");

      setTimeout(() => {
        document.body.classList.remove("flash");
      }, 100);

    });

    document.addEventListener("keydown", (e) => {

      if (e.code === "Space") {

        button.click();

      }

    });

  </script>

</body>

</html>
